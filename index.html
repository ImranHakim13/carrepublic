<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CARREPUBLIC CareOS</title>
<meta name="theme-color" content="#17212b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Konsep: bengkel moden. Tarmac gelap + garisan lorong kuning; plat nombor hitam sebagai motif; papan kerja bengkel dan app telefon pelanggan. */
:root{--ink:#111a22;--tar:#17212b;--tar2:#243342;--paper:#eef1f0;--card:#fff;--line:#dce2e1;--mut:#5a6771;--lane:#ffd21f;--teal:#0d8a73;--teal-bg:#d8f1e9;--amb:#85500a;--amb-bg:#ffeec4;--red:#b3261e;--red-bg:#fde1df;--blue:#1d5fb8;--blue-bg:#dfeafb;--chip:#e5eae9;--hd:'Bricolage Grotesque',system-ui,sans-serif;--bd:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--bd)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-family:var(--hd);letter-spacing:-.01em;margin:0}
h1{font-size:27px;line-height:1.12;font-weight:800;text-wrap:balance;margin-bottom:6px}
h2{font-size:18px;font-weight:800;margin-bottom:10px}h3{font-size:15px;font-weight:600;margin-bottom:6px}
h2.sec{margin:20px 2px 10px}
p{margin:0 0 8px}
.muted{color:var(--mut);font-size:13px}.sm{font-size:13px}
.ic{width:20px;height:20px;flex:none}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px;box-shadow:0 0 0 5px var(--tar)}
/* shell */
.shell{min-height:100vh}
.side{display:none}
.main{padding:14px 16px 100px;min-width:0;max-width:1140px;margin:0 auto}
.mtop{position:sticky;top:0;z-index:30;background:var(--tar);color:#fff;padding:10px 12px 8px}
.mtop .row1{display:flex;justify-content:space-between;align-items:center}
.logo2{font:800 17px var(--hd);letter-spacing:.02em}.logo2 small{font:500 11px var(--bd);color:#9db0bf;margin-left:6px;letter-spacing:0}
.menub{width:42px;height:42px;display:grid;place-items:center;border:1px solid #35485a;background:var(--tar2);color:#fff;border-radius:12px;cursor:pointer;padding:0}.menub svg{width:22px;height:22px}.menub[aria-expanded=true]{background:var(--lane);color:#111;border-color:var(--lane)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip-r{flex:none;border:0;border-radius:99px;padding:7px 13px;font:600 13px var(--bd);background:var(--tar2);color:#d3dde5;cursor:pointer}
.chip-r[aria-pressed=true]{background:var(--lane);color:#111}
.pop{position:absolute;right:12px;top:54px;width:min(280px,calc(100vw - 24px));background:var(--tar);border:1px solid #35485a;border-radius:16px;padding:8px;display:grid;gap:4px;box-shadow:0 18px 40px rgba(5,12,20,.45)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--bd);color:var(--mut);padding:6px 2px;border-radius:12px;cursor:pointer}
.bnav button[aria-current=true]{color:var(--ink);background:var(--chip)}
@media(min-width:960px){
 .shell{display:grid;grid-template-columns:260px 1fr}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--tar);color:#d3dde5;padding:20px 14px;overflow:auto}
 .mtop,.bnav{display:none}
 .main{padding:28px 34px 60px;width:100%}
}
.logo{padding:2px 8px 18px;display:flex;align-items:baseline;gap:8px}.logo b{font:800 20px var(--hd);color:#fff;letter-spacing:.02em}.logo small{font-size:12px;color:#8da1b1}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lane);margin-right:2px}
.nb,.sb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:#c5d1da;font:600 14px var(--bd);padding:10px 12px;border-radius:12px;cursor:pointer}
.nb:hover,.sb:hover{background:var(--tar2)}
.nb[aria-current=true]{background:var(--tar2);color:#fff;box-shadow:inset 3px 0 0 var(--lane)}
.subs{margin:2px 0 8px 22px;border-left:1px solid #34475a;padding-left:8px}
.sb{font-weight:500;padding:7px 10px;font-size:13.5px}.sb[aria-current=true]{color:var(--lane);font-weight:700}
.sidef{margin-top:auto;display:grid;gap:6px;padding-top:16px}
.sidef .btn,.pop .btn{background:var(--tar2);color:#e3ecf2;font-weight:600;justify-content:flex-start}
.sidef .btn.out,.pop .btn.out{background:none;border:1px solid #35485a}
.env{font-size:11.5px;color:#8da1b1;padding:6px 8px 0}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font:700 14px var(--bd);cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;line-height:1.2}
.btn.alt{background:var(--lane);color:#111}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--red-bg);color:var(--red)}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:500}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid #cfd8d6;background:#fff;color:var(--ink);font:500 16px var(--bd)}
input[type=checkbox]{width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.sp{justify-content:space-between}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--teal-bg);color:#0a6a58}.pill.warn{background:var(--amb-bg);color:var(--amb)}.pill.bad{background:var(--red-bg);color:var(--red)}.pill.info{background:var(--blue-bg);color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;min-width:0}
.card.flat{border:0;background:transparent;padding:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.grid>*{min-width:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi small{display:block;color:var(--mut);font-size:12.5px}.kpi b{display:block;white-space:nowrap;font:800 24px/1.2 var(--hd);font-variant-numeric:tabular-nums}
.kpi.hot{background:var(--lane);border-color:var(--lane)}.kpi.hot small{color:#4d3f00}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}
.hint{background:var(--blue-bg);color:#154a92;border-radius:12px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;max-width:min(92vw,520px);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(10,20,30,.25);animation:toast 6.5s forwards;pointer-events:none}
.toast.ok{background:var(--tar);color:#fff}.toast.err{background:var(--red);color:#fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}6%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(min-width:960px){.toast{bottom:28px}}
.fab span{display:none}.fab{position:fixed;right:14px;bottom:84px;z-index:40;border:0;border-radius:99px;background:var(--lane);color:#111;font:700 14px var(--bd);padding:11px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 22px rgba(10,20,30,.28);cursor:pointer}
@media(min-width:960px){.fab{bottom:24px;right:28px}.fab span{display:inline}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:min(560px,100%);border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:22px}}
/* login */
.lg{min-height:100vh;display:grid;grid-template-columns:1fr}
.lg-l{background:var(--tar);color:#fff;padding:28px 22px 34px;position:relative;overflow:hidden}
.lg-l::after{content:'';position:absolute;left:0;right:0;bottom:22px;height:4px;background:repeating-linear-gradient(90deg,var(--lane) 0 34px,transparent 34px 68px);opacity:.9;animation:road 3s linear infinite}
@keyframes road{to{background-position:68px 0}}
.lg-l .logo{padding:0 0 28px}
.lg-l h1{font-size:34px;max-width:15ch;color:#fff}
.lg-l p{color:#b9c8d3;max-width:44ch}
.lg-l ul{list-style:none;padding:0;margin:20px 0 40px;display:grid;gap:10px;color:#dbe6ee;font-size:14.5px}
.lg-l li{display:flex;gap:10px;align-items:flex-start}.lg-l li::before{content:'';flex:none;margin-top:8px;width:8px;height:8px;border-radius:50%;background:var(--lane)}
.lg-r{padding:26px 20px 40px;display:flex;align-items:center;justify-content:center}
.lg-r form{width:min(400px,100%)}
@media(min-width:900px){.lg{grid-template-columns:1.1fr 1fr}.lg-l{padding:56px 56px}.lg-l h1{font-size:50px}}
@media(prefers-reduced-motion:reduce){.lg-l::after{animation:none}.toast{animation-duration:.01s;animation-delay:6s}}
/* plat & kenderaan */
.plate{display:inline-block;background:#0a0a0a;color:#fff;font:800 16px/1 var(--hd);letter-spacing:.12em;padding:5px 11px 4px;border-radius:6px;outline:1.5px solid rgba(255,255,255,.75);outline-offset:-3px;white-space:nowrap}
.plate.sm{font-size:13px;padding:4px 8px 3px}
.vscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0;padding:2px 0 10px;scrollbar-width:none}.vscroll::-webkit-scrollbar{display:none}
.vcard{flex:0 0 100%;scroll-snap-align:center;background:var(--tar);color:#fff;border-radius:24px;padding:16px 16px 20px;position:relative;overflow:hidden}
.vcard::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--lane) 0 22px,transparent 22px 44px)}
.vcard .vm{font-size:13px;color:#b9c8d3}
.carw{margin:6px 0 4px}.carw svg{width:100%;max-height:112px}
.vstats{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;align-items:center;margin-bottom:10px}
.vstats small{display:block;color:#9db0bf;font-size:11.5px}.vstats b{font:700 15px var(--hd);display:block}
.rg{display:flex;gap:10px;align-items:center}
.ring{width:56px;height:56px;flex:none}.ring .rb{fill:none;stroke:#2d3e4e;stroke-width:6}.ring .rf{fill:none;stroke:var(--lane);stroke-width:6;stroke-linecap:round}.ring.over .rf{stroke:#ff7b72}.ring text{fill:#fff;font:700 13px var(--hd)}
.xchip{display:inline-block;border-radius:99px;font-size:12px;font-weight:600;padding:3px 10px;background:#2d3e4e;color:#dce6ee}
.xchip.ok{background:#14473d;color:#aeeedd}.xchip.warn{background:#4d3c0c;color:#ffe08a}.xchip.bad{background:#59201c;color:#ffc2bd}
.greet{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.greet small{color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;background:var(--tar);color:var(--lane);display:grid;place-items:center;font:800 18px var(--hd)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.qa button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font:700 14px var(--bd);color:var(--ink);cursor:pointer;text-align:left}
.qa .ic{width:24px;height:24px}
.phone{width:100%;max-width:420px;margin:0 auto}
@media(min-width:960px){.phone{border:10px solid #0a1016;border-radius:46px;box-shadow:0 34px 60px -24px rgba(10,20,30,.4);padding:22px 14px 24px;min-height:780px;background:var(--paper)}.phone::before{content:'';display:block;width:96px;height:22px;background:#0a1016;border-radius:0 0 14px 14px;margin:-22px auto 14px}.phone h1{font-size:24px}}
.phonewrap{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}.phone{min-width:0}
@media(min-width:1100px){.phonewrap{grid-template-columns:minmax(0,1fr) 420px;align-items:start}.phone{margin:0}}
.sidecol{display:none}@media(min-width:1100px){.sidecol{display:block}}
.sidecol .card{background:var(--tar);color:#dbe6ee;border:0}.sidecol h3{color:#fff}.sidecol .muted{color:#9db0bf}
.mob-only{display:block}@media(min-width:1100px){.mob-only{display:none}}
/* tracker */
.trk{list-style:none;display:flex;margin:16px 0 6px;padding:0}
.trk li{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mut);line-height:1.2}
.trk li i{display:block;width:14px;height:14px;border-radius:50%;background:#cdd6d4;margin:0 auto 6px;position:relative;z-index:1}
.trk li::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:#cdd6d4}
.trk li:first-child::before{display:none}
.trk li.done i,.trk li.done::before,.trk li.now::before{background:var(--teal)}
.trk li.now i{background:var(--lane);box-shadow:0 0 0 4px rgba(255,210,31,.4);animation:pulse 1.9s ease-out infinite}
.trk li.now{color:var(--ink);font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,210,31,0)}}
@media(prefers-reduced-motion:reduce){.trk li.now i{animation:none}}
.say{background:var(--chip);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:6px}
.action{border:2px solid var(--lane);background:#fffbe6}
/* tempah */
.step{display:flex;gap:10px;align-items:center;margin:16px 0 8px;font:800 15px var(--hd)}
.step span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.svcs{display:grid;gap:8px}
.svc{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font:inherit;color:inherit}
.svc b{font-weight:700}.svc small{color:var(--mut);display:block}
.svc[aria-pressed=true]{border-color:var(--ink);background:#f7f9f8}
.days,.slots{display:flex;flex-wrap:wrap;gap:8px}
.day,.slot{border:1px solid #cfd8d6;background:#fff;color:var(--ink);border-radius:12px;padding:9px 13px;font:700 14px var(--bd);cursor:pointer;min-width:62px}
.day small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.day[aria-pressed=true],.slot[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.day[aria-pressed=true] small{color:#c8d3da}
/* pasport */
ol.tl{border-left:2px solid var(--line);margin:8px 0 0 6px;padding:0 0 0 16px;list-style:none}
ol.tl li{margin-bottom:14px;position:relative}ol.tl li::before{content:'';position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
ol.tl li.ext::before{background:#aab5b3}
/* partner */
.partner{border:2px dashed #b8c3c1;border-radius:18px;padding:16px;background:#fff}
.logoslot{width:100%;height:54px;border-radius:12px;background:repeating-linear-gradient(135deg,#f0f3f2 0 10px,#e8edec 10px 20px);display:grid;place-items:center;font-size:12px;color:var(--mut);margin-bottom:10px}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:#e3e9e7;border-radius:16px;padding:8px;min-height:150px;scroll-snap-align:start}
.col>h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 6px 8px;margin:0}
.cnt{background:var(--ink);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.kc{display:block;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:14px;padding:10px 11px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.kc[aria-pressed=true]{border-color:var(--ink)}
.kc .t{font-size:12.5px;color:var(--mut);margin-top:6px}
.kc.wait{box-shadow:inset 4px 0 0 var(--lane)}
.detail{margin-top:6px}
/* jadual bay */
.bay{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.bay>b{font:700 13px var(--hd)}
.lane{position:relative;height:56px;border-radius:12px;background:repeating-linear-gradient(90deg,#e3e9e7 0 1px,transparent 1px calc(100%/9)),#f4f6f5;border:1px solid var(--line)}
.blk{position:absolute;top:5px;bottom:5px;border-radius:9px;background:var(--tar);color:#fff;font-size:10.5px;padding:5px 6px;overflow:hidden;line-height:1.25;white-space:nowrap;text-overflow:clip}
.blk.s-service,.blk.s-quality,.blk.s-ready{background:var(--teal)}.blk.s-awaiting{background:var(--lane);color:#111}.blk.s-confirmed{background:#fff;color:var(--ink);border:2px dashed #9aa8a6}
.hours{display:grid;grid-template-columns:repeat(9,1fr);margin-left:62px;font-size:11px;color:var(--mut);margin-bottom:4px}
/* charts */
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:34px;background:var(--tar);border-radius:6px 6px 2px 2px;min-height:3px}
.bars .b.t i{background:var(--lane)}
.bars span{font-size:10.5px;color:var(--mut);white-space:nowrap}
.bars em{font:700 11px var(--bd);font-style:normal}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.pipe div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pipe b{display:block;font:800 26px var(--hd)}.pipe small{color:var(--mut);font-size:12px}
.hero-m{background:var(--tar);color:#fff;border-radius:24px;padding:24px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-m h1{color:#fff;font-size:30px;max-width:20ch}.hero-m p{color:#b9c8d3;max-width:60ch}
.hero-m::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--lane) 0 26px,transparent 26px 52px)}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:12px}
.roles .card{margin:0;display:flex;flex-direction:column;gap:6px}.roles .card p{flex:1}
.flow{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.flow li{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.flow li div{flex:1}.flow li b{display:block}
.todo{display:grid;gap:8px}.todo button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;font:600 14px var(--bd);cursor:pointer;color:var(--ink)}
.scopebar{margin:0 0 14px}.scopebar label{margin:0;font-weight:700;color:var(--ink);max-width:460px}.scopebar select{font-weight:700;border:2px solid var(--ink)}
.net td,.net th{padding:9px 6px}.net tr[data-act]{cursor:pointer}
.kpis.ceo{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi.ceo{display:flex;flex-direction:column;gap:2px}.kpi .sub{font-size:12px;color:var(--mut)}
.dl{display:inline-block;margin-top:4px;border-radius:99px;font-size:11.5px;font-weight:700;padding:2px 8px;background:var(--chip);color:var(--mut);align-self:flex-start}.dl.up{background:var(--teal-bg);color:#0a6a58}.dl.dn{background:var(--red-bg);color:var(--red)}
.cg{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

function slotsFor(bid,svc,date){
  const b=by('branches',bid),d=SV[svc].d,out=[];
  if(!b||!date)return out;
  const day=new Date(date+'T00:00:00');if(b.closed.includes(day.getDay()))return out;
  const [oh,om]=b.open.split(':').map(Number),[ch,cm]=b.close.split(':').map(Number);
  for(let m=oh*60+om;m+d<=ch*60+cm;m+=30){
    const s=new Date(date+'T'+pad(Math.floor(m/60))+':'+pad(m%60)+':00').getTime(),e=s+d*60000;
    if(s<=now().getTime())continue;
    const used=S.bookings.filter(k=>k.bid===bid&&!['cancelled','noshow','completed'].includes(k.st)&&k.s<e&&k.e>s).length;
    if(used<b.bays)out.push({s,e,free:b.bays-used});
  }
  return out;
}
function setMsg(t,s){ui.msg={t,s}}
function book(){
  const f=ui.f;const {vid,bid,svc}=f;
  if(!vid||!bid||!svc||!ui.slot)return setMsg('err','Pilih kenderaan, cawangan, servis dan slot.');
  const v=by('vehicles',vid),sl=slotsFor(bid,svc,f.date).find(x=>x.s===ui.slot);
  if(!sl)return setMsg('err','Slot sudah penuh atau tidak sah. Pilih slot lain.');
  if(S.bookings.some(k=>k.vid===vid&&!['cancelled','noshow','completed'].includes(k.st)&&k.s<sl.e&&k.e>sl.s))return setMsg('err','Kenderaan ini sudah ada tempahan bertindih.');
  const b={id:nid('b'),vid,bid,svc,s:sl.s,e:sl.e,st:'confirmed',src:f.src||'direct',insp:null,share:!!f.share};
  S.bookings.push(b);S.consent.history=!!f.share;
  S.reminders.forEach(r=>{if(r.vid===vid&&r.st!=='completed')r.booked=true});
  ui.slot=null;ui.f.src='';ui.done='Tempahan disahkan di '+by('branches',bid).name+' pada '+dtfmt(sl.s)+'.';setMsg('ok',ui.done);ui.ct='utama';save();
}

function saveInsp(id){const b=by('bookings',id),f=ui.f;const km=+f['ikm:'+id];
  if(!['arrived','inspection'].includes(b.st))return setMsg('err','Pemeriksaan hanya selepas kenderaan tiba.');
  const items=CHECK.map((c,i)=>({item:c,res:f['ir:'+id+':'+i]||'tidak',note:f['in:'+id+':'+i]||''}));
  b.insp={km:km||null,items,done:true};b.st='inspection';
  const v=by('vehicles',b.vid);if(km&&km>=v.km)v.km=km;setMsg('ok','Pemeriksaan disimpan.');save()}
function sendQuote(id){const b=by('bookings',id),f=ui.f;
  if(!(b.st==='inspection'&&b.insp&&b.insp.done)&&b.st!=='service')return setMsg('err','Lengkapkan pemeriksaan dahulu.');
  const items=[0,1,2,3].map(i=>({d:(f['qd:'+id+':'+i]||'').trim(),q:+(f['qq:'+id+':'+i]||1),p:+(f['qp:'+id+':'+i]||0),dk:f['qk:'+id+':'+i]||''})).filter(x=>x.d);
  if(!items.length)return setMsg('err','Sebut harga tiada item.');
  if(items.some(x=>!(x.q>0)||!(x.p>=0)))return setMsg('err','Kuantiti atau harga tidak sah.');
  S.quotes.push({id:nid('q'),bid:id,items,total:items.reduce((a,x)=>a+x.q*x.p,0),st:'sent',add:b.st==='service'});

function complete(id){const b=by('bookings',id),f=ui.f,v=by('vehicles',b.vid),br=by('branches',b.bid);
  if(!['quality','ready'].includes(b.st))return setMsg('err','Servis mesti melepasi semakan kualiti dahulu.');

  const qs=S.quotes.filter(q=>q.bid===id&&q.st==='approved');if(!qs.length)return setMsg('err','Tiada sebut harga diluluskan pelanggan.');
  const km=+f['ok:'+id],sum=(f['os:'+id]||'').trim();if(!(km>=0)||!f['ok:'+id])return setMsg('err','Odometer keluar wajib diisi.');
  if(km<v.km)return setMsg('err','Odometer tidak boleh lebih rendah daripada rekod terakhir ('+v.km+' km).');
  if(!sum)return setMsg('err','Ringkasan kerja wajib diisi.');
  const items=qs.flatMap(q=>q.items),total=items.reduce((a,x)=>a+x.q*x.p,0),d=ymd(now());
  const rec={id:nid('r'),vid:b.vid,bid:b.bid,bk:id,src:'verified',date:d,km,oil:f['oo:'+id]||'',sum,total,cost:f['oc:'+id]?+f['oc:'+id]:null,inv:'INV-'+br.id+'-'+d.replace(/-/g,'').slice(2)+'-'+(S.seq+1),items,ts:now().getTime()};if(b.insp&&b.insp.fm)rec.dx=dxSnap(b.insp,qs.flatMap(q=>q.items).map(i=>i.dk).filter(Boolean));
  S.records.push(rec);v.km=km;b.st='completed';
  S.reminders.forEach(r=>{if(r.vid===b.vid&&r.st!=='completed')r.st='completed'});
  const due=new Date(now());due.setMonth(due.getMonth()+v.im);
  S.reminders.push({id:nid('m'),vid:b.vid,date:ymd(due),km:km+v.ik,booked:false,st:'open',rec:rec.id,basis:'Anggaran berdasarkan selang '+v.ik+' km atau '+v.im+' bulan (tetapan kenderaan). Ini peringatan jadual, bukan diagnosis mekanikal.'});
  setMsg('ok','Servis selesai. Invois '+rec.inv+' dan rekod pasport dijana.');save()}

${SB_URL.indexOf('__')<0?`<p style="margin-top:10px"><button type="button" class="btn ghost full" data-act="staffLogin">Log masuk staf (data sebenar)</button></p><p class="muted"><a href="#tempah">Borang tempahan pelanggan</a></p>`:''}
<p class="muted" style="margin-top:14px">Demo sahaja. Semua nama, plat dan harga ialah contoh. Data tersimpan dalam pelayar anda dan tidak dikongsi.</p></form></section></div>${msgBox()}`}

function ctrls(){return `<button class="btn" data-act="fbOpen">${I('chat')}Beri komen</button><button class="btn" data-act="skip">${I('gear')}Simulasi +6 bulan${S.skip?' ('+Math.round(S.skip/30)+' bln)':''}</button><button class="btn" data-act="reset">${I('wrench')}Set semula data demo</button><button class="btn out" data-act="logout">Log keluar</button>`}

const bdg=k=>{if(k!=='arahan')return '';const n=tkOpen(ui.branch==='ALL'?'KMN':ui.branch).length;return n?`<em class="bdg">${n}</em>`:''};
function shell(){
  const n=NAV.find(x=>x.id===ui.role);
  const side=`<aside class="side"><div class="logo"><i></i><b>CARREPUBLIC</b><small>CareOS</small></div><nav aria-label="Peranan">${NAV.map(x=>`<button class="nb" aria-current="${ui.role===x.id}" data-act="role" data-v="${x.id}">${I(x.ic)}${x.t}</button>${ui.role===x.id&&x.subs.length?`<div class="subs">${x.subs.map(([k,t])=>`<button class="sb" aria-current="${ui[x.k]===k}" data-act="${x.k}" data-v="${k}">${t}${bdg(k)}</button>`).join('')}</div>`:''}`).join('')}</nav><div class="sidef">${ctrls()}<div class="env">Persekitaran demo. Data contoh disimpan dalam pelayar ini.</div></div></aside>`;
  const mtop=`<header class="mtop"><div class="row1"><span class="logo2">CARREPUBLIC<small>CareOS</small></span><button class="menub" data-act="menu" aria-label="Menu" aria-expanded="${!!ui.menu}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">${ui.menu?'<path d="M6 6l12 12M18 6L6 18"/>':'<path d="M4 7h16M4 12h16M4 17h16"/>'}</svg></button></div><div class="chips">${NAV.map(x=>`<button class="chip-r" aria-pressed="${ui.role===x.id}" data-act="role" data-v="${x.id}">${x.t.replace(/ \(.*\)/,'')}</button>`).join('')}</div>${ui.menu?`<div class="pop">${ctrls()}</div>`:''}</header>`;
  const bnav=n.subs.length?`<nav class="bnav" aria-label="Menu">${n.subs.map(([k,t,ic])=>`<button aria-current="${ui[n.k]===k}" data-act="${n.k}" data-v="${k}">${I(ic)}${t}${bdg(k)}</button>`).join('')}</nav>`:'';
  const body=ui.role==='master'?viewMaster():ui.role==='mgr'?viewNetwork():ui.role==='arahan'?viewArahan():ui.role==='cust'?viewCust():ui.role==='branch'?viewBranch():ui.role==='kerja'?viewKerja():viewHQ();
  return `<div class="shell">${side}${mtop}<main class="main" id="main">${body}</main>${bnav}</div><button class="fab" data-act="fbOpen">${I('chat')}<span>Komen</span></button>${ui.fb?fbModal():''}${msgBox()}`}

function fbModal(){return `<div class="modal" data-act="fbClose"><div role="dialog" aria-label="Beri komen"><h2>Beri komen</h2><p class="muted">Tulis apa yang baik, mengelirukan atau kurang. Komen dihantar kepada pemilik demo bersama nama paparan yang anda sedang lihat.</p>
${input('fb:n','Nama anda (pilihan)')}<label>Komen<textarea id="fb:t" data-ui="fb:t" rows="4" maxlength="1000" placeholder="Contoh: Saya mahu nampak harga insurans di sini.">${esc(ui.f['fb:t']||'')}</textarea></label>
<div class="row"><button class="btn alt" data-act="fbSend">Hantar komen</button><button class="btn ghost" data-act="fbClose">Batal</button></div></div></div>`}

/* ---------- master ---------- */
const inS=b=>ui.branch==='ALL'||b===ui.branch;
function scopeBar(all){const g={};S.branches.forEach(b=>{(g[b.state]=g[b.state]||[]).push(b)});
  return `<div class="scopebar"><label>Cawangan dipantau<select id="bsel" data-act="bsel">${all?`<option value="ALL" ${ui.branch==='ALL'?'selected':''}>Semua cawangan (${S.branches.length})</option>`:''}${Object.entries(g).map(([st,l])=>`<optgroup label="${esc(st)}">${l.map(b=>`<option value="${b.id}" ${b.id===ui.branch?'selected':''}>${esc(b.name)}${b.st==='aktif'?'':' (onboarding)'}</option>`).join('')}</optgroup>`).join('')}</select></label></div>`}
const scopeName=()=>ui.branch==='ALL'?'seluruh rangkaian':by('branches',ui.branch).name;
function stats(){const rs=S.records.filter(r=>r.src==='verified'&&inS(r.bid)),rev=rs.reduce((a,r)=>a+r.total,0);
  const act=S.bookings.filter(b=>activeB(b)&&inS(b.bid));
  return {rs,rev,act,wait:act.filter(b=>b.st==='awaiting').length,over:S.reminders.filter(r=>remStatus(r)==='overdue'&&inS((S.records.find(x=>x.id===r.rec)||{}).bid)).length,leads:ui.branch==='ALL'?S.leads.filter(l=>l.st==='baharu').length:null,apps:S.apps.filter(a=>a.st==='baharu'&&inS((by('jobs',a.jid)||{}).bid)).length}}
const PIPE=[['confirmed','Akan tiba'],['arrived','Tiba'],['inspection','Pemeriksaan'],['awaiting','Tunggu kelulusan'],['service','Diservis'],['quality','Semakan kualiti'],['ready','Sedia diambil']];
/* ---------- pelanggan ---------- */
const TRK=['Disahkan','Tiba','Periksa','Kelulusan','Servis','Siap'];
const TRKI={confirmed:0,arrived:1,inspection:2,awaiting:3,service:4,quality:4,ready:5,completed:5};
const SAY={confirmed:'Tempahan anda disahkan. Kami menunggu anda.',arrived:'Kenderaan diterima. Pemeriksaan akan bermula.',inspection:'Juruteknik sedang memeriksa kenderaan anda.',awaiting:'Sebut harga sedia. Kerja hanya bermula selepas anda meluluskan.',service:'Kerja sedang dibuat.',quality:'Semakan kualiti akhir sedang dibuat.',ready:'Kenderaan sedia diambil. Sila ke kaunter.'};
const tracker=b=>{const i=TRKI[b.st];return `<ol class="trk" aria-label="Status: ${esc(ST[b.st])}">${TRK.map((n,k)=>`<li class="${k<i?'done':k===i?'now':''}"><i></i>${n}</li>`).join('')}</ol>`};
function ring(pct,over){const r=26,c=2*Math.PI*r,o=c*(1-Math.min(Math.max(pct,0),1));
  return `<svg class="ring ${over?'over':''}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="rb"/><circle cx="32" cy="32" r="${r}" class="rf" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle">${Math.round(Math.min(Math.max(pct,0),1.99)*100)}%</text></svg>`}
function vCard(v){const r=S.reminders.find(x=>x.vid===v.id&&x.st!=='completed');let pct=0,sub='Belum ada jadual',over=false;
  if(r){pct=(v.km-(r.km-v.ik))/v.ik;const left=r.km-v.km;over=left<=0;sub=left>0?left.toLocaleString('ms-MY')+' km lagi':'Lebih '+(-left).toLocaleString('ms-MY')+' km'}
  const e1=expiry(v.rt),e2=expiry(v.ins);
  const ch=(l,e)=>`<span class="xchip ${e==null?'':e<0?'bad':e<=60?'warn':'ok'}">${l}: ${e==null?'belum diisi':e<0?'tamat':e+' hari'}</span>`;
  return `<article class="vcard"><div class="row sp">${plate(v.plate)}<span class="vm">${esc(v.make)} ${esc(v.model)}${v.year?' · '+v.year:''}</span></div><div class="carw" style="color:${esc(v.col||'#9aa5ad')}">${carSvg()}</div>
  <div class="vstats"><div><small>Odometer</small><b>${v.km.toLocaleString('ms-MY')} km</b></div><div class="rg">${ring(pct,over)}<div><small>Servis seterusnya</small><b>${sub}</b></div></div></div><div class="row" style="gap:6px">${ch('Cukai jalan',e1)}${ch('Insurans',e2)}</div>${(()=>{const p=pendingDx(v);return p?`<div class="dxs"><b>${p.dx.defer.length} tindakan disyorkan foreman</b><span>${esc(p.dx.defer[0].item)}${p.dx.defer.length>1?' dan lain-lain':''}</span></div>`:''})()}</article>`}
function quoteCard(q){const b=by('bookings',q.bid),v=by('vehicles',b.vid);
  return `<div class="card action"><h2>Sebut harga menunggu anda</h2><p class="muted">${plate(v.plate,'sm')} ${esc(by('branches',b.bid).name)}${q.add?' · <b>Kerja tambahan</b>':''}</p>
  <div class="scroll"><table><tbody>${q.items.map(i=>`<tr><td>${esc(i.d)}</td><td class="num">${i.q} × ${rm(i.p)}</td></tr>`).join('')}</tbody></table></div>
  ${b.insp&&b.insp.fm?`<details class="dxd"><summary>Kenapa kerja ini? Lihat laporan foreman</summary>${dxReport(b.insp)}</details>`:''}<div class="row sp" style="margin:10px 0"><b>Jumlah ${rm(q.total)}</b></div><div class="row"><button class="btn" data-act="approve" data-id="${q.id}">Luluskan</button><button class="btn ghost" data-act="reject" data-id="${q.id}">Tolak</button></div><p class="muted" style="margin-top:8px">Tiada kerja tambahan dibuat tanpa kelulusan anda.</p></div>`}
function bookCard(b){const v=by('vehicles',b.vid);
  return `<div class="card"><div class="row sp"><span>${plate(v.plate,'sm')} <b>${SV[b.svc].n}</b></span><span class="pill ${b.st==='awaiting'?'warn':b.st==='confirmed'?'info':'ok'}">${ST[b.st]}</span></div><div class="muted">${esc(by('branches',b.bid).name)} · ${dtfmt(b.s)}</div>${tracker(b)}<div class="say">${SAY[b.st]||''}</div>${b.st==='confirmed'?`<button class="btn ghost sm" style="margin-top:10px" data-act="cancel" data-id="${b.id}">Batal tempahan</button>`:''}</div>`}

function viewCust(){const t=ui.ct;
  const body=t==='utama'?cUtama():t==='tempah'?cTempah():t==='pasport'?cPasport():t==='rakan'?cRakan():cSaya();
  const side=`<div class="sidecol"><div class="card"><h3>Anda sedang melihat app pelanggan</h3><p class="muted">Ini apa yang Aisyah nampak di telefonnya. Gunakan Cawangan dan HQ di menu kiri untuk melihat sisi bengkel dan pejabat pusat bagi data yang sama.</p><p class="muted">Cuba: luluskan sebut harga Myvi, kemudian buka Cawangan untuk lihat status berubah.</p></div></div>`;
  return `<div class="phonewrap"><div class="phone" id="phone">${body}</div>${side}</div>`}
function cUtama(){const ids=mine().map(v=>v.id);
  const qs=S.quotes.filter(q=>q.st==='sent'&&ids.includes(by('bookings',q.bid).vid));
  const bks=S.bookings.filter(b=>ids.includes(b.vid)&&activeB(b)).sort((a,b)=>a.s-b.s);
  const rems=S.reminders.filter(r=>r.st!=='completed'&&ids.includes(r.vid));
  let h=`<div class="greet"><div><small>Selamat datang,</small><h1 style="margin:0">${esc((S.profile.name||'Pelanggan').split(' ')[0])}</h1></div><span class="av" aria-hidden="true">${esc((S.profile.name||'A')[0])}</span></div>`;
  h+=qs.map(quoteCard).join('');
  h+=`<div class="vscroll">${mine().map(vCard).join('')}</div>`+dxTodo();
  if(bks.length)h+=`<h2 class="sec">Servis anda</h2>`+bks.map(bookCard).join('');
  h+=`<div class="qa"><button data-act="ct" data-v="tempah">${I('cal')}Tempah servis</button><button data-act="ct" data-v="pasport">${I('book')}Pasport servis</button><button data-act="ct" data-v="rakan">${I('shield')}Insurans dan roadtax</button><button data-act="ct" data-v="saya">${I('user')}Profil dan privasi</button></div>`;
  if(rems.length)h+=`<div class="card"><h2>Peringatan servis</h2>${rems.map(r=>{const v=by('vehicles',r.vid),s=remStatus(r),[tt,c]=REM[s];return `<div style="margin-bottom:12px"><div class="row sp"><span>${plate(v.plate,'sm')} <span class="pill ${c}">${tt}</span></span>${s!=='booked'?`<button class="btn alt sm" data-act="remBook" data-id="${r.vid}">Tempah</button>`:''}</div><div class="sm">Anggaran ${dfmt(r.date)} atau ${r.km.toLocaleString('ms-MY')} km</div><div class="muted">${esc(r.basis)}</div></div>`}).join('')}${S.consent.reminder?'':'<p class="muted">Peringatan mesej dimatikan. Status masih kelihatan di sini.</p>'}</div>`;
  return h}
function cTempah(){const f=ui.f,mv=mine();if(!f.vid||!mv.find(v=>v.id===f.vid))f.vid=mv[0]&&mv[0].id;if(!f.bid)f.bid='KMN';if(!f.svc)f.svc='oil';
  const days=[0,1,2,3,4,5].map(n=>ymd(addDays(now(),n)));if(!f.date)f.date=days[1];
  const sl=slotsFor(f.bid,f.svc,f.date),pr=(S.prices[f.bid]||{})[f.svc];
  const dn=(s,i)=>i===0?'Hari ini':i===1?'Esok':new Date(s+'T00:00:00').toLocaleDateString('ms-MY',{weekday:'short'});
  const mb=S.bookings.filter(b=>mv.some(v=>v.id===b.vid)).sort((a,b)=>b.s-a.s);
  return `<h1>Tempah servis</h1><p class="muted">Cawangan yang disahkan sahaja. Harga akhir mengikut sebut harga selepas pemeriksaan.</p>
  <div class="step"><span>1</span>Kenderaan</div>${sel('vid','',mv.map(v=>[v.id,v.plate+' · '+v.make+' '+v.model]))}
  <div class="step"><span>2</span>Servis</div><div class="svcs">${Object.entries(SV).map(([k,s])=>{const p=estP(k);return `<button class="svc" aria-pressed="${f.svc===k}" data-act="svc" data-v="${k}"><span><b>${s.n}</b><small>${s.d} minit</small></span><b>${p==null?'Hubungi':rm(p)}</b></button>`}).join('')}</div>
  ${estBreak()}
  <div class="step"><span>3</span>Cawangan</div>${sel('bid','',S.branches.filter(b=>b.st==='aktif').map(b=>[b.id,b.name+' ('+b.city+')']))}<p class="muted">${esc(by('branches',f.bid).note)}</p>
  <div class="step"><span>4</span>Hari dan masa</div><div class="days">${days.map((d,i)=>`<button class="day" aria-pressed="${f.date===d}" data-act="day" data-v="${d}">${dn(d,i)}<small>${new Date(d+'T00:00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'short'})}</small></button>`).join('')}</div>
  <div class="slots" style="margin-top:10px">${sl.length?sl.map(x=>`<button class="slot" aria-pressed="${ui.slot===x.s}" data-act="slot" data-v="${x.s}">${hm(x.s)}</button>`).join(''):'<span class="muted">Tiada slot (cawangan tutup, penuh atau masa telah lalu). Pilih hari lain.</span>'}</div>
  <label style="margin:14px 0 10px;color:var(--ink)"><input type="checkbox" id="share" data-ui="share" data-cb="1" ${f.share?'checked':''}>Kongsi sejarah servis kenderaan ini dengan cawangan ini sepanjang tempahan aktif (boleh ditarik balik).</label>
  <button class="btn alt full" data-act="book" ${ui.slot?'':'disabled'}>Sahkan tempahan</button>
  <h2 class="sec">Tempahan saya</h2>${mb.length?mb.map(b=>{const v=by('vehicles',b.vid);return `<div class="card"><div class="row sp"><b>${SV[b.svc].n}</b><span class="pill ${b.st==='completed'?'ok':b.st==='cancelled'||b.st==='noshow'?'bad':'info'}">${ST[b.st]}</span></div><div class="muted">${esc(v.plate)} · ${esc(by('branches',b.bid).name)} · ${dtfmt(b.s)}</div>${b.st==='confirmed'?`<button class="btn ghost sm" style="margin-top:8px" data-act="cancel" data-id="${b.id}">Batal</button>`:''}</div>`}).join(''):'<p class="muted">Tiada tempahan lagi.</p>'}`}
function cPasport(){
  return `<h1>Pasport servis</h1><p class="muted">Satu sejarah untuk kenderaan anda, di mana-mana cawangan CARREPUBLIC.</p>${mine().map(v=>{const rs=S.records.filter(r=>r.vid===v.id).sort((a,b)=>b.ts-a.ts),nb=new Set(rs.filter(r=>r.bid).map(r=>r.bid)).size;
    return `<div class="card"><div class="row sp">${plate(v.plate)}<span class="muted">${esc(v.make)} ${esc(v.model)}</span></div><p class="muted" style="margin-top:6px">${rs.filter(r=>r.src==='verified').length} servis disahkan · ${nb} cawangan</p>${rs.length?`<ol class="tl">${rs.map(r=>`<li class="${r.src==='verified'?'':'ext'}"><div class="row"><b>${dfmt(r.date)}</b>${r.src==='verified'?'<span class="pill ok">Disahkan CARREPUBLIC</span>':'<span class="pill">Dokumen pelanggan</span>'}</div><div>${esc(r.sum)}</div><div class="muted">${r.bid?esc(by('branches',r.bid).name):'Luar rangkaian'} · ${r.km?r.km.toLocaleString('ms-MY')+' km':'km tiada'}${r.oil?' · '+esc(r.oil):''}${r.total!=null?' · '+rm(r.total):''}${r.inv?' · '+esc(r.inv):''}</div>${r.dx?`<details class="dxd"><summary>Laporan diagnosis · ${r.dx.kritikal?r.dx.kritikal+' segera, ':''}${r.dx.pantau} pantau</summary>${dxSnapView(r.dx)}</details>`:''}${r.items.length?`<ul class="sm" style="margin:4px 0 0;padding-left:18px">${r.items.map(i=>`<li>${esc(i.d)}: ${rm(i.q*i.p)}</li>`).join('')}</ul>`:''}</li>`).join('')}</ol>`:'<p class="muted">Belum ada rekod.</p>'}</div>`}).join('')}
  <details class="card"><summary>Tambah rekod servis luar</summary><div class="grid">${sel('ev','Kenderaan',vOpts())}${input('ed','Tarikh',{type:'date'})}${input('ek','Odometer',{mode:'numeric'})}${input('es','Ringkasan')}</div><button class="btn" data-act="addExt">Simpan rekod</button><p class="muted" style="margin-top:6px">Rekod ini dilabel sebagai dokumen pelanggan, bukan disahkan.</p></details>`}
function cRakan(){
  const pt=(type,title,desc)=>{const p=S.partners[type];if(!p.on)return '';return `<div class="partner"><div class="logoslot">${p.name?esc(p.name):'Ruang logo rakan'}</div><div class="row sp"><h2 style="margin:0">${title}</h2><span class="pill warn">${p.name?'Rakan':'Slot kosong'}</span></div>
  <p class="sm" style="margin-top:6px">${desc}</p><p class="muted">${p.name?'Rakan: <b>'+esc(p.name)+'</b>. ':'Belum ada rakan sebenar disambungkan; ini susun atur contoh. '}Harga, produk dan kelayakan ditentukan oleh rakan, bukan CARREPUBLIC.</p>
  ${sel('lv:'+type,'Kenderaan',vOpts())}${input('lp:'+type,'No. telefon',{mode:'tel',ph:'01X-XXXXXXX'})}
  <p class="sm">Tarikh ${type==='insurance'?'insurans':'cukai jalan'} tamat: ${(()=>{const v=by('vehicles',ui.f['lv:'+type]);const d=v&&(type==='insurance'?v.ins:v.rt);return d?dfmt(d):'(pilih kenderaan)'})()}</p>
  <label style="color:var(--ink)"><input type="checkbox" id="lc:${type}" data-ui="lc:${type}" data-cb="1" ${ui.f['lc:'+type]?'checked':''}>Saya bersetuju CARREPUBLIC berkongsi nama, telefon dan nombor plat saya dengan rakan untuk sebut harga ini sahaja.</label>
  <button class="btn alt full" data-act="lead" data-id="${type}">Minta sebut harga</button></div>`};
  const my=S.leads.filter(l=>mine().some(v=>v.id===l.vid));
  return `<h1>Insurans dan roadtax</h1><p class="muted">Ruangan rakan dalam app. Anda hanya dihubungi selepas memberi persetujuan.</p><div class="grid">${pt('insurance','Insurans kenderaan','Bandingkan dan perbaharui insurans melalui rakan.')}${pt('roadtax','Pembaharuan cukai jalan','Perbaharui cukai jalan tanpa beratur, melalui rakan.')}</div>
  <div class="card" style="margin-top:12px"><h3>Permohonan anda</h3>${my.length?my.slice().reverse().map(l=>`<div class="sm">${l.type==='insurance'?'Insurans':'Cukai jalan'} · ${esc(l.plate)} · ${dtfmt(l.ts)} · <span class="pill info">${esc(l.st)}</span></div>`).join(''):'<span class="muted">Belum ada.</span>'}</div>`}
function cSaya(){const c=S.consent;const row=(k,t)=>`<label style="color:var(--ink)"><input type="checkbox" id="c:${k}" data-act="consent" data-id="${k}" ${c[k]?'checked':''}>${t}</label>`;
  return `<h1>Profil dan privasi</h1><div class="card"><h2>Profil</h2>${input('pf:name','Nama')}${input('pf:phone','No. telefon (untuk WhatsApp)',{mode:'tel',ph:'01X-XXXXXXX'})}${input('pf:pc','Poskod (untuk cadangan cawangan)',{mode:'numeric'})}</div>
  <div class="card"><h2>Persetujuan</h2>${row('reminder','Peringatan servis')}${row('marketing','Mesej promosi')}${row('history','Kongsi sejarah servis dengan cawangan yang saya tempah')}${row('location','Guna lokasi untuk cadangan cawangan')}<p class="muted">Menarik balik persetujuan menghentikan mesej berkaitan, tetapi sejarah servis anda kekal.</p></div>
  <div class="card"><h2>Kenderaan</h2>${mine().map(v=>{const e1=expiry(v.rt),e2=expiry(v.ins);return `<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row sp">${plate(v.plate,'sm')}<span class="muted">${v.km.toLocaleString('ms-MY')} km</span></div>
  <div class="row" style="margin:8px 0"><input id="km:${v.id}" data-ui="km:${v.id}" inputmode="numeric" placeholder="km baharu" style="width:130px;margin:0" value="${esc(ui.f['km:'+v.id]||'')}"><button class="btn ghost sm" data-act="updKm" data-id="${v.id}">Kemas kini odometer</button></div>

function aggM(ms,pred){return ms.map(m=>{const a={m,rev:0,cost:0,jobs:0,newc:0,rep:0,noshow:0,bk:0,tatw:0,svc:{oil:0,ac:0,brake:0,tyre:0},byB:{}};

  S.hist.filter(h=>h.m===m&&pred(h.bid)).forEach(h=>{add(h.bid,h.rev,h.cost,h.jobs);a.newc+=h.newc;a.rep+=h.rep;a.noshow+=h.noshow;a.bk+=h.bk;a.tatw+=h.tat*h.jobs;for(const k in h.svc)a.svc[k]+=h.svc[k]});
  S.records.filter(r=>r.src==='verified'&&r.date.slice(0,7)===m&&pred(r.bid)).forEach(r=>add(r.bid,r.total,r.cost||0,1));

/* kesihatan cawangan (RAG) */
function healthRows(){const pace=dayFrac(),ms=monthsBack(1);
  return S.branches.filter(b=>b.st==='aktif'&&inS(b.id)).map(br=>{const a=kpi(aggM(ms,x=>x===br.id)),tg=S.targets[br.id]||0,att=tg?a.rev/tg:null,cap=br.bays*26*7*pace,ut=a.jobs/Math.max(1,cap),wait=S.bookings.filter(k=>k.bid===br.id&&k.st==='awaiting').length,late=tkLateN(br.id);
   const rag=(v,g,y,rev)=>rev?(v<=g?0:v<=y?1:2):(v>=g?0:v>=y?1:2);
   const m=[['Sasaran hasil',att==null?'-':pc(att),att==null?0:rag(att,pace,pace-.15)],['Utilisasi bay',pc(ut),rag(ut,.5,.35)],['Tidak hadir',pc(a.nsP,1),rag(a.nsP,.05,.08,1)],['Tunggu kelulusan',wait+' kerja',rag(wait,0,1,1)],['Arahan lewat',late+'',rag(late,0,1,1)]];
   return {br,m,w:Math.max(...m.map(x=>x[2])),rev:a.rev}}).sort((x,y)=>y.w-x.w)}
function healthPanel(){const rows=healthRows(),L=['Sihat','Perlu perhatian','Kritikal'],C=['ok','warn','bad'];
  return `<h2 class="sec">Kesihatan cawangan</h2><p class="muted" style="margin:-6px 0 10px">Lampu isyarat setiap cawangan, yang paling bermasalah di atas. Merah atau kuning bermaksud CEO patut bertindak.</p>
  <div class="hgrid">${rows.map(r=>`<div class="card hc ${C[r.w]}"><div class="row sp"><div><b style="font:800 17px var(--hd)">${esc(SHORT(r.br.id))}</b><div class="muted sm">Ketua: ${esc(HOD[r.br.id])}</div></div><span class="pill ${C[r.w]}">${L[r.w]}</span></div>
   <div class="hm">${r.m.map(([n,v,g])=>`<div><i class="dot ${C[g]}"></i><span>${n}</span><b>${v}</b></div>`).join('')}</div>
   <div class="row" style="gap:8px;margin-top:10px"><button class="btn sm ghost" data-act="goBranch" data-id="${r.br.id}">Buka cawangan</button><button class="btn sm alt" data-act="tkTo" data-id="${r.br.id}">Beri arahan</button></div></div>`).join('')||'<div class="card"><p class="muted">Tiada cawangan aktif dalam pilihan ini.</p></div>'}</div>`}

function findings(){return memo('finds',()=>{const E=eng(),D=E.D,lm=lastM(),out=[],a0=lm-2,p0=lm-5;
 const rng=(m1,m2,bi)=>({from:D.mStart(m1),to:Math.min(D.mStart(m2+1)-1,D.TODAY),br:[bi]});
 const d90={from:D.TODAY-89,to:D.TODAY},d30={from:D.TODAY-29,to:D.TODAY};
 const nat=E.pl({from:D.mStart(a0),to:D.mStart(lm+1)-1});
 const natRw=nat.A.n?nat.A.rw/nat.A.n:0;
 const u30=utilAll(d30.from,d30.to),u90=utilAll(d90.from,d90.to);
 D.BR.forEach((b,bi)=>{if(b.od>D.mStart(p0))return;const cu=E.pl(rng(a0,lm,bi)),pv=E.pl(rng(p0,a0-1,bi));if(!cu.net||!pv.net||cu.bm==null||pv.bm==null)return;
  const cs=cu.net/3,ps=pv.net/3,gr=cs/ps-1;
  /* margin hakis walaupun jualan naik */
  if(gr>=.03&&cu.bm<=pv.bm-.03){const ms=[0,1,2].map(i=>{const q=E.pl(rng(a0+i,a0+i,bi));return q.bm});const consistent=ms.every(x=>x<pv.bm);
   const rentC=cu.O.rent/3,rentP=pv.O.rent/3,dc=cu.A.gross?cu.A.disc/cu.A.gross:0,dp=pv.A.gross?pv.A.disc/pv.A.gross:0;
   out.push({id:'sq-'+b.id,br:bi,sev:'tinggi',t:`${b.n}: jualan naik tetapi margin EBITDA cawangan jatuh`,ev:[`Jualan purata sebulan ${rmk(ps)} → ${rmk(cs)} (${sg(gr)}).`,`Margin EBITDA cawangan ${pf(pv.bm)} → ${pf(cu.bm)} (3 bulan lalu berbanding 3 bulan sebelumnya).`,`Sewa sebulan ${rmf(rentP)} → ${rmf(rentC)}; kadar diskaun ${pf(dp)} → ${pf(dc)}; margin untung kasar ${pf(pv.gpm)} → ${pf(cu.gpm)}.`,consistent?'Ketiga-tiga bulan terkini lebih rendah daripada purata tempoh sebelum.':'Bukan semua bulan terkini lebih rendah; corak belum konsisten.'],imp:(pv.bm-cu.bm)*cs,impL:'Margin yang hilang seunit jualan semasa, sebulan',conf:consistent?'Tinggi':'Sederhana',act:'Semak kenaikan sewa dan polisi diskaun cawangan ini; tetapkan siling diskaun dan rundingkan semula sewa jika mungkin.',owner:'Pengurus Rangkaian + Kewangan',due:21,m:{k:'bm',br:bi}})}
  /* bawah bajet */
  const bd=E.budget(rng(a0,lm,bi));if(bd&&cu.net<bd.rev*.9&&matOf(b)==='m'){out.push({id:'bud-'+b.id,br:bi,sev:'sederhana',t:`${b.n}: jualan di bawah bajet (simulasi) 3 bulan berturut-turut`,ev:[`Jualan 3 bulan ${rmk(cu.net)} berbanding bajet ${rmk(bd.rev)} (${pf(cu.net/bd.rev-1)}).`,`Penggunaan kapasiti 30 hari terakhir ${u30[bi].u!=null?pf(u30[bi].u):'—'}.`],imp:(bd.rev-cu.net)/3*(cu.gpm||0),impL:'Kekurangan untung kasar sebulan berbanding bajet',conf:'Sederhana',act:'Semak aliran pelanggan masuk dan kempen tempatan; bandingkan dengan cawangan sebaya.',owner:'Pengurus Cawangan',due:30,m:{k:'net',br:bi}})}
  /* kerja semula & TAT */
  const c90=E.agg(Object.assign({br:[bi]},d90)),rwr=c90.n?c90.rw/c90.n:0;
  if(c90.n>150&&rwr>=Math.max(.04,natRw*2)){const per=(c90.cost+c90.lab)/c90.n;out.push({id:'rw-'+b.id,br:bi,sev:'sederhana',t:`${b.n}: kadar kerja semula tinggi berbanding rangkaian`,ev:[`Kerja semula ${pf(rwr)} (90 hari) berbanding rangkaian ${pf(natRw)}.`,`Siap ikut janji ${pf(c90.tatOn/c90.n)}; purata TAT ${Math.round(c90.tat/c90.n)} minit.`,`${c90.rw} kerja semula dalam 90 hari.`],imp:c90.rw*per/3,impL:'Anggaran kos langsung kerja semula sebulan (kos alat + upah purata)',conf:'Sederhana',act:'Audit kualiti dan semakan akhir; latih semula juruteknik di bay berkaitan.',owner:'Ketua Operasi',due:30,m:{k:'rw',br:bi}})}
  /* kapasiti penuh */
  const lc=D.lost.filter(l=>l.b===bi&&l.reason==='kapasiti'&&l.d>=d90.from).reduce((a,l)=>a+l.val,0);
  if(u30[bi].u>=.85&&lc>0)out.push({id:'cap-'+b.id,br:bi,sev:'tinggi',t:`${b.n}: bay hampir penuh dan permintaan ditolak kerana kapasiti`,ev:[`Penggunaan kapasiti 30 hari ${pf(u30[bi].u)}.`,`Permintaan hilang sebab bay penuh 90 hari: ${rmk(lc)} (direkod depan kaunter).`,`Andaian boleh dipulih ${pf(recov('kapasiti'),0)} (ubah di tab Kenderaan & permintaan).`],imp:lc/3*recov('kapasiti')*(nat.gpm||.35),impL:'Untung kasar yang boleh dipulih sebulan (anggaran)',conf:'Sederhana',act:'Nilai tambah bay/syif dahulu; jika lonjakan berterusan, bandingkan dengan cawangan baharu berdekatan (tab Ekspansi).',owner:'CEO + Pengurus Rangkaian',due:45,m:{k:'util',br:bi}})});
 /* stok habis (rangkaian, ikut SKU) */

 Object.values(bySku).sort((a,b)=>b.val-a.val).slice(0,2).forEach(q=>{const s=D.SKUS[q.si],b=D.BR[q.bi];const days=(D.SO[q.bi][q.si]||[]).reduce((a,[x,y])=>a+Math.max(0,Math.min(y,D.TODAY)-Math.max(x,d90.from)+1),0);
  out.push({id:'so-'+b.id+'-'+q.si,br:q.bi,sev:q.val>3000?'tinggi':'sederhana',t:`${b.n}: stok ${s.n} kerap habis`,ev:[`${q.n} permintaan direkod hilang kerana stok habis dalam 90 hari, bernilai ${rmf(q.val)}.`,`Hari stok habis dalam 90 hari: ${days}.`,`Andaian boleh dipulih ${pf(recov('stok'),0)}.`],imp:q.val/3*recov('stok')*(nat.gpm||.35),impL:'Untung kasar yang boleh dipulih sebulan (anggaran)',conf:'Sederhana',act:'Naikkan paras pesanan semula dan stok penimbal untuk SKU ini; semak masa penghantaran pembekal.',owner:'Pembelian',due:14,m:{k:'lostStock',br:q.bi,si:q.si}})});
 /* margin produk */
 const mm=lm;D.SKUS.forEach((s,si)=>{D.BR.forEach((b,bi)=>{if(b.od>D.mStart(lm))return;const mg=1-D.pc(bi,si,mm)/s.price;if(mg<.12){const u=D.usage[bi][si][mm]||0;if(u>=30&&!out.find(o=>o.id==='mg-'+si)){const sk0=1-D.pc(bi,si,0)/s.price;out.push({id:'mg-'+si,br:bi,sev:'sederhana',t:`${s.n}: margin alat ganti nipis di ${b.n}`,ev:[`Margin harga senarai ${pf(mg)} bulan lepas berbanding ${pf(sk0)} pada bulan pertama data.`,`Kos unit RM ${D.pc(bi,si,mm).toFixed(2)} berbanding harga RM ${s.price.toFixed(2)}.`,`Jualan ${nf(u)} unit sebulan di cawangan ini.`],imp:u*(.2*s.price-(s.price-D.pc(bi,si,mm))),impL:'Jika margin dibawa ke 20% harga senarai (anggaran)',conf:'Sederhana',act:'Semak harga jualan dan sebut harga pembekal alternatif.',owner:'Pembelian',due:30,m:{k:'skumg',br:bi,si}})}}})});
 const rank={tinggi:0,sederhana:1,rendah:2};
 return out.sort((a,b)=>(b.imp||0)-(a.imp||0)||rank[a.sev]-rank[b.sev])})}
function metricVal(m){const E=eng(),D=E.D,lm=lastM();if(!m)return null;const d90={from:D.TODAY-89,to:D.TODAY};
 if(m.k==='bm')return E.pl({from:D.mStart(lm-2),to:D.mStart(lm+1)-1,br:[m.br]}).bm;

 if(m.k==='rw'){const a=E.agg(Object.assign({br:[m.br]},d90));return a.n?a.rw/a.n:null}

 if(m.k==='skumg')return 1-D.pc(m.br,m.si,lm)/D.SKUS[m.si].price;return null}

async function loadAll(){
  try{st.busy=true;
    st.roles=await api('/rest/v1/staff_roles?select=role,branch_id,active,full_name&user_id=eq.'+st.uid+'&active=eq.true');
    st.branches=await api('/rest/v1/branches?select=id,code,name,city,open_time,close_time,bays&order=name');
    st.branches=st.branches.filter(b=>b.code.indexOf('DEMO')!==0);
    if(!st.roles.length){st.busy=false;return}
    const mine=st.roles.map(r=>r.branch_id).filter(Boolean);
    if(!st.branch||!st.branches.find(b=>b.id===st.branch))st.branch=mine[0]||(st.branches[0]&&st.branches[0].id);
    if(isFore())st.tab='papan';
    await loadBranch();clearInterval(st.poll);st.poll=setInterval(()=>{if(st.tok&&!document.hidden)loadBranch(true)},10000)
  }catch(e){say('err',errBM(e.message))}finally{st.busy=false}}
async function loadBranch(quiet){if(!st.branch)return;
  try{const from=myDay(-1),to=myDay(14);
    const [b,sv]=await Promise.all([rpc('staff_board',{p_branch:st.branch,p_from:from,p_to:to}),
      api('/rest/v1/branch_services?select=service_id,price_myr,price_verified,duration_min,active,services(name,category)&branch_id=eq.'+st.branch+'&order=service_id')]);
    st.board=b||[];st.svcs=sv||[];
    if(canTeam()){try{st.team=await rpc('staff_team',{p_branch:st.branch})}catch(e){}}
    st.last=Date.now();paint(quiet)}catch(e){if(!quiet)say('err',errBM(e.message))}}

/* ---- auth ---- */
async function signIn(){const e=(st.f.em||'').trim().toLowerCase(),p=st.f.pw||'';if(!e||!p)return say('err','Isi e-mel dan kata laluan.');
  try{st.busy=true;paint();const r=await raw('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:e,password:p}});
    if(!r.ok)throw new Error((r.j&&(r.j.msg||r.j.error_description))||'Gagal log masuk');setSess(r.j);st.f.pw='';await loadAll();
    if(!st.roles.length)say('err','Akaun ini belum dijemput sebagai staf. Minta pemilik jemput e-mel anda.')}
  catch(x){say('err',errBM(x.message))}finally{st.busy=false;paint()}}
async function signUp(){const e=(st.f.em||'').trim().toLowerCase(),p=st.f.pw||'',n=(st.f.nm||'').trim();
  if(!n||!e)return say('err','Isi nama dan e-mel.');if(p.length<8)return say('err','Kata laluan minimum 8 aksara.');
  try{st.busy=true;paint();const r=await raw('/auth/v1/signup',{method:'POST',auth:false,body:{email:e,password:p,data:{account_type:'staff',full_name:n}}});
    if(!r.ok)throw new Error((r.j&&(r.j.msg||r.j.error_description||r.j.message))||'Gagal daftar');
    st.mode='in';st.f.pw='';say('ok','Akaun dicipta. Semak e-mel anda dan klik pautan pengesahan, kemudian Log masuk. Anda mesti dijemput oleh pemilik dahulu.')}
  catch(x){say('err',errBM(x.message))}finally{st.busy=false;paint()}}
async function signOut(){try{await raw('/auth/v1/logout',{method:'POST'})}catch(e){}signOutLocal();st.mode='in';st.board=[];paint()}

/* ---- tindakan data ---- */
async function doRpc(name,args,okMsg){try{st.busy=true;paint(true);const r=await rpc(name,args);if(okMsg)say('ok',okMsg);await loadBranch(true);return r}
  catch(e){say('err',errBM(e.message));return null}finally{st.busy=false;paint(true)}}
const advance=(id,s)=>doRpc('staff_advance_booking',{p_booking:id,p_status:s},'Status dikemas kini: '+BM[s]);
const assign=(id,u)=>doRpc('staff_assign_pic',{p_booking:id,p_user:u||null},'PIC dikemas kini.');
async function loadSlots(){const f=st.f;if(!f.nb_svc||!f.nb_date)return;
  try{st.slots=await rpc('available_slots',{p_branch:st.branch,p_service:f.nb_svc,p_date:f.nb_date})}catch(e){st.slots=[]}paint()}
async function createBooking(){const f=st.f,w=f.nb_w,src=f.nb_src||'walkin';
  if(!f.nb_svc||!f.nb_slot)return say('err','Pilih servis dan slot masa.');
  if(!w&&(!(f.nb_name||'').trim()||!(f.nb_plate||'').trim()))return say('err','Isi nama dan no. plat, atau pilih pelanggan sedia ada.');
  const r=await doRpc('staff_create_booking',{p_branch:st.branch,p_service:f.nb_svc,p_start:f.nb_slot,p_source:src,p_walkin:w||null,p_name:f.nb_name||null,p_phone:f.nb_phone||null,p_email:f.nb_email||null,p_plate:f.nb_plate||null,p_make:f.nb_make||null,p_model:f.nb_model||null,p_mileage:f.nb_km?+f.nb_km:null,p_notes:f.nb_notes||null,p_pic:f.nb_pic||null},'Tempahan dimasukkan.');
  if(r){st.newB=false;['nb_svc','nb_slot','nb_w','nb_name','nb_phone','nb_email','nb_plate','nb_make','nb_model','nb_km','nb_notes','nb_pic'].forEach(k=>delete st.f[k]);st.slots=null;paint()}}
async function searchWalk(){try{st.walk=await rpc('staff_walkins',{p_branch:st.branch,p_q:st.wq||null})||[]}catch(e){say('err',errBM(e.message))}paint(true)}
async function addWalk(){const f=st.f;if(!(f.w_name||'').trim())return say('err','Nama pelanggan wajib.');
  const r=await doRpc('staff_add_walkin',{p_branch:st.branch,p_name:f.w_name,p_phone:f.w_phone||null,p_email:f.w_email||null,p_plate:f.w_plate||null,p_make:f.w_make||null,p_model:f.w_model||null,p_year:f.w_year?+f.w_year:null,p_mileage:f.w_km?+f.w_km:null,p_notes:f.w_notes||null},'Pelanggan disimpan.');
  if(r){st.newW=false;['w_name','w_phone','w_email','w_plate','w_make','w_model','w_year','w_km','w_notes'].forEach(k=>delete st.f[k]);searchWalk()}}
async function invite(){const f=st.f;if(!(f.iv_email||'').trim()||!(f.iv_name||'').trim())return say('err','Isi nama dan e-mel.');
  const r=await doRpc('staff_invite',{p_email:f.iv_email.trim(),p_name:f.iv_name.trim(),p_role:f.iv_role||'technician',p_branch:st.branch},'Jemputan dicipta. Minta mereka daftar akaun dengan e-mel ini.');
  if(r){delete st.f.iv_email;delete st.f.iv_name;paint()}}
async function savePrice(sid){const v=st.f['pr:'+sid];if(v===undefined||v==='')return say('err','Isi harga.');const n=+v;if(!(n>=0))return say('err','Harga tidak sah.');
  try{await api('/rest/v1/branch_services?branch_id=eq.'+st.branch+'&service_id=eq.'+sid,{method:'PATCH',prefer:'return=minimal',body:{price_myr:n,price_verified:true}});say('ok','Harga disimpan.');delete st.f['pr:'+sid];await loadBranch(true)}catch(e){say('err',errBM(e.message))}}

/* ---- awam ---- */
async function loadPub(){const p=st.pub;if(p.loaded)return;
  try{const [b,s]=await Promise.all([api('/rest/v1/branches?select=id,code,name,city,address,open_time,close_time&origin=eq.actual&order=name',{auth:false}),
    api('/rest/v1/branch_services?select=branch_id,service_id,price_myr,duration_min,services(name)&active=eq.true',{auth:false})]);
    p.branches=b;p.svcs=s;p.loaded=true;if(b.length===1)p.f.br=b[0].id}catch(e){p.err='Tidak dapat memuatkan cawangan. Cuba lagi sebentar.'}paint()}
async function pubSlots(){const f=st.pub.f;if(!f.br||!f.sv||!f.dt)return;
  try{st.pub.slots=await api('/rest/v1/rpc/available_slots',{method:'POST',auth:false,body:{p_branch:f.br,p_service:f.sv,p_date:f.dt}})}catch(e){st.pub.slots=[]}paint()}
async function pubSubmit(){const p=st.pub,f=p.f;
  if(!f.br||!f.sv||!f.slot)return pubErr('Pilih cawangan, servis dan slot masa.');
  if(!(f.nm||'').trim()||!(f.ph||'').trim()||!(f.pl||'').trim())return pubErr('Nama, no. telefon dan no. plat wajib.');
  try{p.busy=true;p.err=null;paint();const ref=await api('/rest/v1/rpc/public_request_booking',{method:'POST',auth:false,body:{p_branch:f.br,p_service:f.sv,p_start:f.slot,p_name:f.nm,p_phone:f.ph,p_email:f.em||null,p_plate:f.pl,p_make:f.mk||null,p_model:f.md||null,p_notes:f.nt||null,p_hp:f.hp||null}});
    p.done={ref,when:f.slot,br:p.branches.find(b=>b.id===f.br),sv:p.svcs.find(s=>s.service_id===f.sv&&s.branch_id===f.br)}}
  catch(e){p.err=errBM(e.message);p.slots=null;p.f.slot=null}finally{p.busy=false;paint()}}
function pubErr(t){st.pub.err=t;paint()}

function waQueue(){return S.reminders.filter(r=>r.st!=='completed').map(r=>{const v=by('vehicles',r.vid),st=remStatus(r),why=[];

function viewKerja(){const open=S.jobs.filter(j=>j.st==='terbuka');
  return `<h1>Kerjaya CARREPUBLIC</h1><p class="muted">Paparan calon. Jawatan yang diterbitkan HQ tampil di sini. Maklumat anda hanya digunakan untuk pengambilan ini.</p>${open.length?open.map(jobCardPublic).join(''):'<div class="card muted">Tiada jawatan dibuka sekarang.</div>'}`}
function jobForm(){const f=ui.f;if(!f['j:role'])f['j:role']='Penasihat Servis';
  return `<div class="card"><h2>Buka jawatan baharu</h2><div class="row" style="align-items:end">${sel('j:role','Templat jawatan',Object.keys(JOB_TPL).map(k=>[k,k]))}<button class="btn ghost" data-act="jobFill" style="margin-bottom:8px">Muat templat</button></div>
  <div class="grid">${input('j:title','Tajuk jawatan')}${sel('j:bid','Cawangan',S.branches.map(b=>[b.id,b.name]))}${input('j:count','Bilangan kekosongan',{mode:'numeric',ph:'1'})}${sel('j:type','Jenis',[['Sepenuh masa','Sepenuh masa'],['Kontrak','Kontrak'],['Separuh masa','Separuh masa'],['Praktikal','Praktikal']])}${input('j:shift','Waktu / syif')}${input('j:edu','Pendidikan')}${input('j:exp','Pengalaman minimum (tahun)',{mode:'decimal'})}${input('j:salary','Gaji / elaun (isi sendiri, kosong = dibincang)')}${input('j:ben','Faedah (pilihan)')}${input('j:deadline','Tarikh tutup',{type:'date'})}</div>
  <label style="color:var(--fg)"><input type="checkbox" id="j:lic" data-ui="j:lic" data-cb="1" ${f['j:lic']?'checked':''}>Lesen memandu sah diwajibkan</label>
  ${TA('j:must','Syarat wajib (satu setiap baris). Ini digunakan untuk skor padanan.',4)}${TA('j:nice','Kelebihan (satu setiap baris)',3)}${TA('j:qs','Soalan saringan (satu setiap baris)',3)}
  <p class="muted">Templat ialah cadangan permulaan, bukan nasihat undang-undang. Elak syarat jantina, umur, kaum atau agama kecuali keperluan pekerjaan yang sah; semak dengan HR.</p>
  <div class="row"><button class="btn" data-act="jobDraft">Simpan draf</button><button class="btn alt" data-act="jobPub">Terbitkan</button></div></div>`}
function hqRec(){const jobs=S.jobs;
  return `<h1>Rekrutmen staf</h1>${jobForm()}
  <div class="card"><h2>Kekosongan</h2>${jobs.length?jobs.map(j=>{const ap=S.apps.filter(a=>a.jid===j.id);return `<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row sp"><span><b>${esc(j.title)}</b> · ${esc(by('branches',j.bid)?by('branches',j.bid).name:'')} <span class="pill ${j.st==='terbuka'?'ok':j.st==='draf'?'warn':''}">${esc(j.st)}</span>${j.flag?' <span class="pill bad">Perlu semakan HR</span>':''}</span><span class="row">${j.st!=='terbuka'?`<button class="btn ghost" data-act="jobSt" data-id="${j.id}" data-v="terbuka">Terbitkan</button>`:`<button class="btn ghost" data-act="jobSt" data-id="${j.id}" data-v="ditutup">Tutup</button>`}<button class="btn bad" data-act="jobDel" data-id="${j.id}">Padam</button></span></div>
  <div class="muted">${j.count} kekosongan · ${ap.length} calon · syarat wajib: ${j.must.length} · pengalaman minimum ${j.exp} tahun</div></div>`}).join(''):'<p class="muted">Belum ada jawatan.</p>'}</div>
  <div class="card"><h2>Calon (disusun ikut skor padanan)</h2><p class="muted">Skor = 70% syarat wajib yang calon tanda + 30% pengalaman berbanding minimum. Ia alat bantu saringan berdasarkan pengakuan calon, bukan keputusan. Semak setiap calon secara manusia.</p>
  ${S.apps.length?S.apps.map(a=>({a,j:by('jobs',a.jid)})).filter(x=>x.j).map(x=>({...x,s:scoreOf(x.j,x.a)})).sort((p,q)=>q.s.total-p.s.total).map(({a,j,s})=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row sp"><span><b>${esc(a.name)}</b> · ${esc(j.title)}</span><span class="pill ${s.total>=70?'ok':s.total>=40?'warn':'bad'}">Skor ${s.total}/100</span></div>
  <div class="sm">Syarat wajib ${s.met}/${s.tot} · pengalaman ${a.exp} tahun (min ${j.exp})${s.licFlag?' · <span class="pill bad">Tiada lesen (wajib)</span>':''}</div>
  <div class="sm">Tel: ${waPhone(a.phone)?`<a href="https://wa.me/${waPhone(a.phone)}" target="_blank" rel="noopener">${esc(a.phone)}</a>`:esc(a.phone)}${a.email?' · '+esc(a.email):''}</div>
  <details><summary>Jawapan saringan</summary>${j.qs.map((q,i)=>`<div class="sm"><b>${esc(q)}</b><br>${esc(a.ans[i]||'(tiada jawapan)')}</div>`).join('')}</details>
  <label>Peringkat<select data-act="stg" data-id="${a.id}">${STAGES.map(t=>`<option ${a.st===t?'selected':''}>${t}</option>`).join('')}</select></label></div>`).join(''):'<p class="muted">Belum ada calon. Tukar ke paparan Kerjaya (calon) dan hantar satu permohonan untuk mencuba.</p>'}</div>`}
function branchJobs(bid){const js=S.jobs.filter(j=>j.bid===bid&&j.st==='terbuka');return `<div class="card"><h2>Kekosongan staf cawangan ini</h2>${js.length?js.map(j=>`<div class="sm">${esc(j.title)} · ${j.count} kekosongan · ${S.apps.filter(a=>a.jid===j.id).length} calon</div>`).join(''):'<span class="muted">Tiada. HQ membuka jawatan di tab Rekrutmen.</span>'}</div>`}
/* ---------- komen ---------- */
function fbSend(){const t=(ui.f['fb:t']||'').trim(),n=(ui.f['fb:n']||'').trim().slice(0,60);
  if(t.length<3)return setMsg('err','Tulis komen dahulu (sekurang-kurangnya 3 aksara).');
  const nv=NAV.find(x=>x.id===ui.role),ctx=nv.t+(nv.k?' / '+ui[nv.k]:'');
  const row={name:n||null,body:t.slice(0,1000),ctx:ctx.slice(0,80),ua:(navigator.userAgent||'').slice(0,160)};
  const rec={name:row.name,body:row.body,ctx,ts:Date.now(),sent:false};S.fb.push(rec);save();
  ui.fb=false;ui.f['fb:t']='';setMsg('ok','Komen dihantar. Terima kasih.');
  if(SB_URL.indexOf('__')<0){try{fetch(SB_URL+'/rest/v1/demo_feedback',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)}).then(r=>{rec.sent=r.ok;save();render()}).catch(()=>{})}catch(e){}}}

/* ---------- render ---------- */
function render(){
  const y=window.scrollY,ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart;
  const kan=document.getElementById('kan'),kx=kan?kan.scrollLeft:0;
  cur=ui.msg;ui.msg=null;
  if(SM.on()){SM.paint();return}
  document.getElementById('app').innerHTML=!ui.logged?viewLogin():shell();
  const k2=document.getElementById('kan');if(k2)k2.scrollLeft=kx;
  window.scrollTo(0,y);
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(fs!=null)el.setSelectionRange(fs,fs)}catch(e){}}}
}
/* ---------- tindakan ---------- */
const SUBK={cust:'ct',branch:'bt',hq:'ht'};
const A={
 role:e=>{ui.role=e.v;ui.menu=false;window.scrollTo(0,0)},
 ct:e=>{ui.ct=e.v;ui.role='cust';window.scrollTo(0,0)},bt:e=>{ui.bt=e.v;ui.role='branch';window.scrollTo(0,0)},ht:e=>{ui.ht=e.v;ui.role='hq';window.scrollTo(0,0)},
 go:e=>{const [r,s]=e.id.split(':');ui.role=r;if(SUBK[r])ui[SUBK[r]]=s;window.scrollTo(0,0)},
 menu:()=>{ui.menu=!ui.menu},goJob:e=>{const b=by('bookings',e.id);ui.branch=b.bid;ui.role='branch';ui.bt='papan';ui.sel=b.id;window.scrollTo(0,0)},per:e=>{ui.per=e.v},csv:csvMonths,
 goBranch:e=>{ui.branch=e.id;ui.role='branch';ui.bt='papan';ui.sel=null;window.scrollTo(0,0)},
 skip:()=>{S.skip+=182;ui.menu=false;setMsg('ok','Masa disimulasi maju 6 bulan (demo). Peringatan dikira semula.');save()},
 reset:()=>{S=seed();ui.f={le:'master@carrepublic.demo',lp:''};ui.slot=null;ui.sel=null;ui.menu=false;store.set(JSON.stringify(S));setMsg('ok','Data demo disetkan semula.')},
 logout:()=>{ui.logged=false;authSet(false);ui.menu=false;ui.f.lp='Demo#2026'},
 approve:e=>decide(e.id,true),reject:e=>decide(e.id,false),
 remBook:e=>{ui.f.vid=e.id;ui.f.src='reminder';ui.ct='tempah';window.scrollTo(0,0)},
 updKm:e=>updKm(e.id),addVeh:addVehicle,addExt,cancel:e=>cancel(e.id),
 svc:e=>{ui.f.svc=e.v;ui.slot=null},day:e=>{ui.f.date=e.v;ui.slot=null},slot:e=>{ui.slot=+e.v},book,
 sel:e=>{ui.sel=ui.sel===e.id?null:e.id},
 stage:e=>stage(e.id,e.v),insp:e=>saveInsp(e.id),quote:e=>sendQuote(e.id),complete:e=>complete(e.id),
 lead:e=>submitLead(e.id),waSend:e=>waSend(e.id),waStop,waSave,jobFill,jobDraft:()=>jobSave('draf'),jobPub:()=>jobSave('terbuka'),
 jobSt:e=>{by('jobs',e.id).st=e.v;save()},jobDel:e=>{S.jobs=S.jobs.filter(j=>j.id!==e.id);S.apps=S.apps.filter(a=>a.jid!==e.id);save()},
 apply:e=>applyJob(e.id),applyOpen:e=>{ui.apply=e.id},applyClose:()=>{ui.apply=null},
 pname:e=>{S.partners[e.id].name=(ui.f['pn:'+e.id]||'').trim();setMsg('ok','Nama rakan disimpan.');save()},
 tkSend,tkAck:e=>tkAck(e.id),tkDone:e=>tkDone(e.id),tkNudge:e=>tkNudge(e.id,e.v),tkDel:e=>tkDel(e.id),tkTo:e=>{ui.f['tk:to']=e.id;ui.role='arahan';window.scrollTo(0,0)},
 dxSet:e=>{const [k,r]=e.v.split(':'),key=dxK(e.id,k);ui.f[key]=ui.f[key]===r?'':r},
 dxAll:e=>{DXI.filter(i=>i.sec===e.v&&!ui.f[dxK(e.id,i.k)]).forEach(i=>ui.f[dxK(e.id,i.k)]='ok')},
 dxSec:e=>{ui.f['dxs:'+e.id]=dxOpen(e.id)===e.v?'-':e.v},dxLt:e=>{const k=hk(e.id,'lt'),n=LIGHTS[+e.v],a=ui.f[k]||[];ui.f[k]=a.includes(n)?a.filter(x=>x!==n):a.concat(n)},dxQuote:e=>dxQuote(e.id),
 pt:e=>{ui.pt=e.v},posStart,posOpen:e=>{ui.posId=e.id;ui.pt='jual';ui.f.pm='';window.scrollTo(0,0)},posInv:e=>posInv(e.id),posPay:e=>posPay(e.id),posVoid:e=>{sBy(e.id).st='batal';setMsg('ok','Jualan dibatalkan.');save()},posEditBack:e=>{sBy(e.id).st='draf';save()},
 posDel:e=>{sBy(e.id).lines.splice(+e.v,1);save()},posM:e=>{ui.f.pm=e.v},posTender:e=>{ui.f['pay:amt']=e.v},posPrint:()=>{setTimeout(()=>window.print(),80)},posNewSale:()=>{ui.posId=null},posFromEst,posCatAdd,
 staffLogin:()=>SM.open(),
 fbOpen:()=>{ui.fb=true;ui.menu=false},fbClose:()=>{ui.fb=false},fbSend
};
document.addEventListener('click',ev=>{if(ui.menu&&!ev.target.closest('.pop,.menub')){ui.menu=false;if(!ev.target.closest('[data-act]')){render();return}}
  const t=ev.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||t.type==='checkbox')return;
  if(t.classList.contains('modal')&&ev.target!==t)return;
  const f=A[t.dataset.act];if(!f)return;f({id:t.dataset.id,v:t.dataset.v});render()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.fb){ui.fb=false;render()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.act==='consent'){S.consent[t.dataset.id]=t.checked;setMsg('ok','Pilihan disimpan.');save();render();return}
  if(t.dataset.act==='pon'){S.partners[t.dataset.id].on=t.checked;save();render();return}
  if(t.dataset.act==='lst'){by('leads',t.dataset.id).st=t.value;save();render();return}
  if(t.dataset.act==='posAdd'){posAdd(t.dataset.id,t.value);render();return}
  if(t.dataset.act==='bsel'){ui.branch=t.value;ui.sel=null;render();return}
  if(t.dataset.act==='stg'){by('apps',t.dataset.id).st=t.value;save();render();return}
  if(t.dataset.ui){const k=t.dataset.ui;ui.f[k]=t.dataset.cb?t.checked:t.value;
    if(k.startsWith('rt:')){by('vehicles',k.slice(3)).rt=t.value;save()}
    if(k==='pf:name'){S.profile.name=t.value;save()}if(k==='pf:phone'){S.profile.phone=t.value;save()}if(k==='pf:pc'){S.profile.postcode=t.value;save()}
    if(k==='wb'){S.wa.before=+t.value;save()}
    if(k.startsWith('in:')&&k.split(':').length===2){by('vehicles',k.slice(3)).ins=t.value;save()}
    if(['vid','bid','svc','date'].includes(k)){ui.slot=null}
    if(k.startsWith('sl:')||k.startsWith('sf:')){posWrite(k,t.value);return}
    if(k.startsWith('as:')){S.assump=S.assump||{};S.assump[k.slice(3)]=Math.max(0,+t.value||0);save();render();return}
    if(k.startsWith('cp:')){const c=S.catalog.find(x=>x.id===k.slice(3));if(c){c.p=Math.max(0,+t.value||0);save()}return}
    if(k.startsWith('ep:')||k==='pl'||k==='pay:amt'){render();return}
    if((t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&!t.dataset.cb&&t.type!=='date')return;
    render()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.ui&&!t.dataset.cb&&t.type!=='date')ui.f[t.dataset.ui]=t.value});
document.addEventListener('submit',ev=>{if(ev.target.id==='lf'){ev.preventDefault();const e=(ui.f.le||'').trim().toLowerCase(),p=ui.f.lp||'';
  if(e==='master@carrepublic.demo'&&p==='Demo#2026'){ui.logged=true;authSet(true);ui.msg=null;ui.f.lp=''}else setMsg('err','E-mel atau kata laluan salah. Guna akaun master demo.');render()}});
window.__careos={S:()=>S,ui,A,render,SM};
SM.boot();render();
})();
</script>
