<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>CARREPUBLIC CareOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Concept: satu aplikasi tiga paparan (Pelanggan, Cawangan, HQ) dengan satu login master; kad padat, teks besar, BM utama. */
:root{--bg:#f6f4ef;--card:#ffffff;--fg:#14202c;--muted:#5d6b78;--line:#e2ddd2;--brand:#0b2a4a;--brand-fg:#ffffff;--accent:#f2b01e;--accent-fg:#0b2a4a;--ok:#116b43;--ok-bg:#dff3e8;--warn:#7a4b00;--warn-bg:#fdecc2;--bad:#9b1c1c;--bad-bg:#fbe0e0;--info:#0b4a7a;--info-bg:#dcecf9;--chip:#ece8de;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--card:#15212c;--fg:#eaeff4;--muted:#9aa9b6;--line:#26364a;--brand:#f2b01e;--brand-fg:#0b2a4a;--accent:#f2b01e;--accent-fg:#0b2a4a;--ok:#7fd8a8;--ok-bg:#12372a;--warn:#f6cf7a;--warn-bg:#3b2c0b;--bad:#f5a3a3;--bad-bg:#3d1717;--info:#9ccdf2;--info-bg:#102b42;--chip:#1e2d3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161e;--card:#15212c;--fg:#eaeff4;--muted:#9aa9b6;--line:#26364a;--brand:#f2b01e;--brand-fg:#0b2a4a;--accent:#f2b01e;--accent-fg:#0b2a4a;--ok:#7fd8a8;--ok-bg:#12372a;--warn:#f6cf7a;--warn-bg:#3b2c0b;--bad:#f5a3a3;--bad-bg:#3d1717;--info:#9ccdf2;--info-bg:#102b42;--chip:#1e2d3b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:960px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em}.brand b{color:var(--accent)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 15px;font:600 14px var(--font);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.tab.sub[aria-pressed="true"]{background:var(--chip);color:var(--fg);border-color:var(--fg)}
h1{font-size:24px;margin:6px 0 12px;text-wrap:balance}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid>*{min-width:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--muted);display:block;font-size:12px}.kpi b{font-size:21px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 14px var(--font);cursor:pointer;background:var(--brand);color:var(--brand-fg)}
.btn.alt{background:var(--accent);color:var(--accent-fg)}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 16px var(--font)}
input[type=checkbox]{width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--chip);color:var(--fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--muted);font-size:13px}.sm{font-size:13px}
.msg{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--bad-bg);color:var(--bad)}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 13px;font:700 14px var(--font);cursor:pointer}.slot[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
ol.tl{border-left:2px solid var(--line);margin:8px 0 0;padding:0 0 0 14px;list-style:none}ol.tl li{margin-bottom:12px}
.partner{border:2px dashed var(--line);border-radius:14px;padding:14px;background:var(--card)}
.login{max-width:430px;margin:8vh auto 0}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
.hint{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
</style>
</head><body>
<div class="wrap"><div id="app"></div></div>
<script>
(()=>{
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='careos-demo-v3',MEM={};
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return MEM[KEY]||null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){MEM[KEY]=v}}};
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const SV={oil:{n:'Servis minyak enjin & penapis',d:60},ac:{n:'Servis penghawa dingin',d:90},brake:{n:'Pemeriksaan brek (visual)',d:45},tyre:{n:'Pemeriksaan tayar & tekanan',d:30}};
const ST={confirmed:'Disahkan',arrived:'Tiba',inspection:'Pemeriksaan',awaiting:'Menunggu kelulusan pelanggan',service:'Sedang diservis',quality:'Semakan kualiti',ready:'Sedia diambil',completed:'Selesai',cancelled:'Dibatalkan',noshow:'Tidak hadir'};
const CHECK=['Paras minyak enjin','Tekanan & rupa tayar','Brek (pemeriksaan visual)','Bateri','Penghawa dingin','Lampu & isyarat'];
const rm=n=>n==null?'Hubungi cawangan':'RM '+Number(n).toFixed(2);
const dfmt=s=>new Date(s.length<=10?s+'T00:00:00':s).toLocaleDateString('ms-MY',{dateStyle:'medium'});
const dtfmt=t=>new Date(t).toLocaleString('ms-MY',{dateStyle:'medium',timeStyle:'short'});

function seed(){
  const t=new Date();
  return {v:3,seq:100,skip:0,
   branches:[
    {id:'KMN',name:'CARREPUBLIC Kemaman',city:'Kemaman',state:'Terengganu',postcode:'24000',bays:2,open:'09:00',close:'18:00',closed:[0],note:'Alamat, waktu operasi dan harga sebenar belum diisi. Nilai di sini ialah contoh.'},
    {id:'SHA',name:'[Contoh] Cawangan Shah Alam',city:'Shah Alam',state:'Selangor',postcode:'40000',bays:1,open:'09:00',close:'18:00',closed:[0],note:'Cawangan contoh untuk menunjukkan perjalanan merentas negeri.'}],
   prices:{KMN:{oil:120,ac:null,brake:null,tyre:null},SHA:{oil:130,ac:null,brake:null,tyre:null}},
   vehicles:[{id:'v1',plate:'DEMO 1234',make:'Perodua',model:'Myvi',year:2019,km:48000,ik:10000,im:6,rt:ymd(addDays(t,45)),ins:ymd(addDays(t,20))}],
   bookings:[],records:[],reminders:[],quotes:[],leads:[],
   consent:{reminder:true,marketing:false,history:false,location:false},
   partners:{insurance:{on:true,name:'',url:'',note:'Slot rakan insurans kenderaan'},roadtax:{on:true,name:'',url:'',note:'Slot rakan pembaharuan cukai jalan'}}};
}
const JOB_TPL={
 'Penasihat Servis':{shift:'Syif pagi/petang, termasuk Sabtu bergilir',edu:'SPM atau setara; sijil automotif satu kelebihan',exp:1,lic:true,
  must:['Komunikasi dan layanan pelanggan yang jelas','Boleh terangkan kerja servis dan sebut harga berperincian','Asas kenderaan (minyak enjin, brek, tayar, bateri)','Teliti merekod maklumat pelanggan dan kenderaan'],
  nice:['Pengalaman di bengkel atau pusat servis','Guna sistem POS atau CRM','Bahasa Inggeris asas'],
  qs:['Ceritakan satu situasi anda menangani pelanggan yang tidak berpuas hati.','Apa yang anda semak sebelum mencadangkan kerja tambahan kepada pelanggan?','Sedia bekerja pada hujung minggu mengikut giliran?']},
 'Juruteknik':{shift:'Syif bengkel, termasuk Sabtu bergilir',edu:'SKM automotif atau setara, atau pengalaman bengkel yang setara',exp:1,lic:true,
  must:['Servis minyak enjin, penapis, tayar dan brek asas','Guna alat tangan dan alat angkat dengan selamat','Patuh prosedur keselamatan bengkel','Merekod kerja dan semakan dengan jujur dan teliti'],
  nice:['Servis penghawa dingin','Diagnostik OBD asas','Pengalaman pelbagai jenama kenderaan'],
  qs:['Terangkan langkah anda menukar minyak enjin dan penapis dengan selamat.','Bagaimana anda melaporkan kerosakan tambahan yang anda jumpa semasa servis?','Pernah ada kecederaan atau kejadian hampir tercedera di bengkel? Apa yang anda belajar?']},
 'Juruwang / Pentadbir Cawangan':{shift:'Waktu operasi cawangan',edu:'SPM atau setara',exp:0,lic:false,
  must:['Teliti dalam urusan wang dan invois','Komunikasi sopan dengan pelanggan','Boleh guna telefon pintar dan aplikasi asas'],
  nice:['Pengalaman juruwang atau kaunter','Pengalaman POS'],
  qs:['Apa yang anda lakukan jika baki wang tunai tidak sepadan di akhir hari?','Sedia bekerja pada hujung minggu mengikut giliran?']},
 'Pengurus Cawangan':{shift:'Waktu operasi cawangan, termasuk tanggungjawab hujung minggu',edu:'Diploma atau setara, atau pengalaman pengurusan yang setara',exp:3,lic:true,
  must:['Pengalaman mengurus pasukan kecil','Memahami operasi bengkel atau perniagaan perkhidmatan','Menguruskan aduan pelanggan dan kualiti kerja','Membaca laporan jualan dan kos asas'],
  nice:['Pengalaman rangkaian atau francais','Pengalaman jualan dan pemasaran tempatan'],
  qs:['Ceritakan bagaimana anda meningkatkan prestasi pasukan atau cawangan.','Bagaimana anda menyelesaikan aduan pelanggan yang serius?','Apa angka utama yang anda semak setiap hari?']}};
const WA_DEF={reminder:'Salam {nama}, servis kereta {plat} dianggarkan tiba sekitar {tarikh} atau {km} km. Cawangan CARREPUBLIC berhampiran: {cawangan}. Tempah di {pautan}. Ini peringatan jadual, bukan diagnosis kerosakan.',
 overdue:'Salam {nama}, servis kereta {plat} sudah melepasi anggaran ({tarikh} atau {km} km). Kami boleh bantu tempah slot di {cawangan}: {pautan}. Ini peringatan jadual, bukan diagnosis kerosakan.'};
const STOPLINE='\nBalas BERHENTI untuk hentikan peringatan.';
const STAGES=['baharu','saringan','temu duga','tawaran','diterima','tidak diteruskan'];
function ext(){
  if(!S.profile)S.profile={name:'Aisyah (Demo)',phone:'',postcode:'24000'};
  if(!S.wa)S.wa={before:14,tpl:{reminder:WA_DEF.reminder,overdue:WA_DEF.overdue},log:[]};
  if(!S.jobs){const t=JOB_TPL['Penasihat Servis'];S.jobs=[{id:'j1',title:'Penasihat Servis',role:'Penasihat Servis',bid:'KMN',count:1,type:'Sepenuh masa',shift:t.shift,edu:t.edu,exp:t.exp,lic:t.lic,must:t.must.slice(),nice:t.nice.slice(),qs:t.qs.slice(),salary:'',ben:'',deadline:'',st:'terbuka',flag:false}];S.apps=[]}
  S.v=4;
}
let S;try{S=JSON.parse(store.get())}catch(e){}
if(!S||(S.v!==3&&S.v!==4))S=seed();ext();
const save=()=>store.set(JSON.stringify(S));
const nid=p=>p+(++S.seq);
const now=()=>new Date(Date.now()+S.skip*DAY);
const by=(a,id)=>S[a].find(x=>x.id===id);
const ui={logged:false,role:'cust',ct:'garaj',branch:'KMN',f:{},msg:null,slot:null,done:null};

/* ---------- domain ---------- */
function slotsFor(bid,svc,date){
  const b=by('branches',bid),d=SV[svc].d,out=[];
  if(!b||!date)return out;
  const day=new Date(date+'T00:00:00');if(b.closed.includes(day.getDay()))return out;
  const [oh,om]=b.open.split(':').map(Number),[ch,cm]=b.close.split(':').map(Number);
  for(let m=oh*60+om;m+d<=ch*60+cm;m+=30){
    const s=new Date(date+'T'+pad(Math.floor(m/60))+':'+pad(m%60)+':00').getTime(),e=s+d*60000;
    if(s<=now().getTime())continue;
    const used=S.bookings.filter(k=>k.bid===bid&&!['cancelled','noshow','completed'].includes(k.st)&&k.s<e&&k.e>s).length;
    if(used<b.bays)out.push({s,e,free:b.bays-used});
  }
  return out;
}
function setMsg(t,s){ui.msg={t,s}}
function book(){
  const f=ui.f;const {vid,bid,svc}=f;
  if(!vid||!bid||!svc||!ui.slot)return setMsg('err','Pilih kenderaan, cawangan, servis dan slot.');
  const v=by('vehicles',vid),sl=slotsFor(bid,svc,f.date).find(x=>x.s===ui.slot);
  if(!sl)return setMsg('err','Slot sudah penuh atau tidak sah. Pilih slot lain.');
  if(S.bookings.some(k=>k.vid===vid&&!['cancelled','noshow','completed'].includes(k.st)&&k.s<sl.e&&k.e>sl.s))return setMsg('err','Kenderaan ini sudah ada tempahan bertindih.');
  const b={id:nid('b'),vid,bid,svc,s:sl.s,e:sl.e,st:'confirmed',src:f.src||'direct',insp:null,share:!!f.share};
  S.bookings.push(b);S.consent.history=!!f.share;
  S.reminders.forEach(r=>{if(r.vid===vid&&r.st!=='completed')r.booked=true});
  ui.slot=null;ui.f.src='';ui.done='Tempahan disahkan di '+by('branches',bid).name+' pada '+dtfmt(sl.s)+'.';setMsg('ok',ui.done);ui.ct='garaj';save();
}
function cancel(id){const b=by('bookings',id);if(!b||b.st!=='confirmed')return;b.st='cancelled';
  if(!S.bookings.some(k=>k.vid===b.vid&&!['cancelled','noshow','completed'].includes(k.st)))S.reminders.forEach(r=>{if(r.vid===b.vid)r.booked=false});setMsg('ok','Tempahan dibatalkan.');save()}
const NEXT={confirmed:['arrived','noshow'],arrived:['inspection'],service:['quality'],quality:['ready']};
function stage(id,to){const b=by('bookings',id);if(!b)return;if(!(NEXT[b.st]||[]).includes(to))return setMsg('err','Peralihan status tidak dibenarkan.');b.st=to;setMsg('ok','Status: '+ST[to]);save()}
function saveInsp(id){const b=by('bookings',id),f=ui.f;const km=+f['ikm:'+id];
  if(!['arrived','inspection'].includes(b.st))return setMsg('err','Pemeriksaan hanya selepas kenderaan tiba.');
  const items=CHECK.map((c,i)=>({item:c,res:f['ir:'+id+':'+i]||'tidak',note:f['in:'+id+':'+i]||''}));
  b.insp={km:km||null,items,done:true};b.st='inspection';
  const v=by('vehicles',b.vid);if(km&&km>=v.km)v.km=km;setMsg('ok','Pemeriksaan disimpan.');save()}
function sendQuote(id){const b=by('bookings',id),f=ui.f;
  if(!(b.st==='inspection'&&b.insp&&b.insp.done)&&b.st!=='service')return setMsg('err','Lengkapkan pemeriksaan dahulu.');
  const items=[0,1,2,3].map(i=>({d:(f['qd:'+id+':'+i]||'').trim(),q:+(f['qq:'+id+':'+i]||1),p:+(f['qp:'+id+':'+i]||0)})).filter(x=>x.d);
  if(!items.length)return setMsg('err','Sebut harga tiada item.');
  if(items.some(x=>!(x.q>0)||!(x.p>=0)))return setMsg('err','Kuantiti atau harga tidak sah.');
  S.quotes.push({id:nid('q'),bid:id,items,total:items.reduce((a,x)=>a+x.q*x.p,0),st:'sent',add:b.st==='service'});
  b.prev=b.st;b.st='awaiting';setMsg('ok','Sebut harga dihantar kepada pelanggan.');save()}
function decide(qid,ok){const q=by('quotes',qid),b=by('bookings',q.bid);q.st=ok?'approved':'rejected';b.st=ok?'service':(b.prev==='service'?'service':'inspection');setMsg('ok',ok?'Sebut harga diluluskan. Kerja boleh bermula.':'Sebut harga ditolak.');save()}
function complete(id){const b=by('bookings',id),f=ui.f,v=by('vehicles',b.vid),br=by('branches',b.bid);
  if(!['quality','ready'].includes(b.st))return setMsg('err','Servis mesti melepasi semakan kualiti dahulu.');
  if(S.quotes.some(q=>q.bid===id&&q.st==='sent'))return setMsg('err','Masih ada sebut harga menunggu kelulusan.');
  const qs=S.quotes.filter(q=>q.bid===id&&q.st==='approved');if(!qs.length)return setMsg('err','Tiada sebut harga diluluskan pelanggan.');
  const km=+f['ok:'+id],sum=(f['os:'+id]||'').trim();if(!(km>=0)||!f['ok:'+id])return setMsg('err','Odometer keluar wajib diisi.');
  if(km<v.km)return setMsg('err','Odometer tidak boleh lebih rendah daripada rekod terakhir ('+v.km+' km).');
  if(!sum)return setMsg('err','Ringkasan kerja wajib diisi.');
  const items=qs.flatMap(q=>q.items),total=items.reduce((a,x)=>a+x.q*x.p,0),d=ymd(now());
  const rec={id:nid('r'),vid:b.vid,bid:b.bid,bk:id,src:'verified',date:d,km,oil:f['oo:'+id]||'',sum,total,cost:f['oc:'+id]?+f['oc:'+id]:null,inv:'INV-'+br.id+'-'+d.replace(/-/g,'').slice(2)+'-'+(S.seq+1),items,ts:now().getTime()};
  S.records.push(rec);v.km=km;b.st='completed';
  S.reminders.forEach(r=>{if(r.vid===b.vid&&r.st!=='completed')r.st='completed'});
  const due=new Date(now());due.setMonth(due.getMonth()+v.im);
  S.reminders.push({id:nid('m'),vid:b.vid,date:ymd(due),km:km+v.ik,booked:false,st:'open',rec:rec.id,basis:'Anggaran berdasarkan selang '+v.ik+' km atau '+v.im+' bulan (tetapan kenderaan). Ini peringatan jadual, bukan diagnosis mekanikal.'});
  setMsg('ok','Servis selesai. Invois '+rec.inv+' dan rekod pasport dijana.');save()}
function remStatus(r){const v=by('vehicles',r.vid);if(r.st==='completed')return 'completed';if(r.booked)return 'booked';
  const t=ymd(now());if(r.date<t||v.km>=r.km)return 'overdue';if(addDaysStr(r.date,-14)<=t||v.km>=r.km-500)return 'due';return 'upcoming'}
function addDaysStr(s,n){return ymd(addDays(new Date(s+'T00:00:00'),n))}
const REM={upcoming:['Akan datang','info'],due:['Sudah tiba masanya','warn'],overdue:['Tertunggak','bad'],booked:['Sudah ditempah','ok']};
function expiry(s){if(!s)return null;const n=Math.round((new Date(s+'T00:00:00')-new Date(ymd(now())+'T00:00:00'))/DAY);return n}
function submitLead(type){const f=ui.f,v=by('vehicles',f['lv:'+type]);
  if(!v)return setMsg('err','Pilih kenderaan.');
  if(!/^(\+?60|0)\d{8,10}$/.test((f['lp:'+type]||'').replace(/[\s-]/g,'')))return setMsg('err','Masukkan nombor telefon Malaysia yang sah.');
  if(!f['lc:'+type])return setMsg('err','Anda perlu bersetuju berkongsi maklumat dengan rakan untuk meneruskan.');
  S.leads.push({id:nid('l'),type,vid:v.id,plate:v.plate,phone:f['lp:'+type],exp:type==='insurance'?v.ins:v.rt,ts:Date.now(),st:'baharu',partner:S.partners[type].name||'(slot belum diisi)'});
  setMsg('ok','Permohonan dihantar. Rakan akan menghubungi anda. (Demo: tiada mesej sebenar dihantar.)');save()}
function addVehicle(){const f=ui.f;if(!f.nvp||!f.nvm)return setMsg('err','Isi nombor plat dan model.');
  S.vehicles.push({id:nid('v'),plate:f.nvp.toUpperCase(),make:f.nvb||'',model:f.nvm,year:+f.nvy||null,km:+f.nvk||0,ik:10000,im:6,rt:'',ins:''});f.nvp=f.nvm=f.nvb=f.nvy=f.nvk='';setMsg('ok','Kenderaan ditambah.');save()}
function updKm(id){const v=by('vehicles',id),k=+ui.f['km:'+id];if(!k||k<v.km)return setMsg('err','Odometer tidak boleh lebih rendah daripada rekod terakhir ('+v.km+' km).');v.km=k;setMsg('ok','Odometer dikemas kini.');save()}
function addExt(){const f=ui.f;if(!f.ev||!f.ed||!f.es)return setMsg('err','Isi kenderaan, tarikh dan ringkasan.');if(f.ed>ymd(now()))return setMsg('err','Tarikh tidak boleh pada masa hadapan.');
  S.records.push({id:nid('r'),vid:f.ev,bid:null,src:'customer',date:f.ed,km:+f.ek||null,sum:f.es,total:null,cost:null,inv:'',items:[],ts:new Date(f.ed+'T00:00:00').getTime()});setMsg('ok','Rekod ditambah (dilabel sebagai dokumen pelanggan).');save()}

  <div class="scroll"><table><tbody>${q.items.map(i=>`<tr><td>${esc(i.d)}</td><td class="num">${i.q} × ${rm(i.p)}</td></tr>`).join('')}</tbody></table></div>
  <div class="row sp" style="margin-top:10px"><b>Jumlah ${rm(q.total)}</b><span class="row"><button class="btn" data-act="approve" data-id="${q.id}">Luluskan</button><button class="btn ghost" data-act="reject" data-id="${q.id}">Tolak</button></span></div></div>`});

  h+=`<div class="grid"><div class="card"><h2>Kenderaan</h2>${S.vehicles.map(v=>{
    const e1=expiry(v.rt),e2=expiry(v.ins);const pill=e=>e==null?'<span class="pill">Belum diisi</span>':e<0?`<span class="pill bad">Tamat ${-e} hari lalu</span>`:e<=60?`<span class="pill warn">${e} hari lagi</span>`:`<span class="pill ok">${e} hari lagi</span>`;
    return `<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${esc(v.plate)}</b><span class="pill warn">DEMO</span></div><div class="muted">${esc(v.make)} ${esc(v.model)} ${v.year||''}</div><div class="sm">Odometer: <b>${v.km} km</b></div>
    <div class="row" style="margin:8px 0"><input id="km:${v.id}" data-ui="km:${v.id}" inputmode="numeric" placeholder="km baharu" style="width:120px;margin:0" value="${esc(ui.f['km:'+v.id]||'')}"><button class="btn ghost" data-act="updKm" data-id="${v.id}">Kemas kini</button><button class="btn" data-act="remBook" data-id="${v.id}">Tempah</button></div>
    <div class="sm">Cukai jalan tamat: ${v.rt?dfmt(v.rt):'-'} ${pill(e1)}</div><div class="sm">Insurans tamat: ${v.ins?dfmt(v.ins):'-'} ${pill(e2)}</div>
    <div class="row" style="margin-top:6px"><label style="margin:0;flex:1 1 130px">Tarikh cukai jalan<input type="date" id="rt:${v.id}" data-ui="rt:${v.id}" value="${esc(v.rt)}"></label><label style="margin:0;flex:1 1 130px">Tarikh insurans<input type="date" id="in:${v.id}" data-ui="in:${v.id}" value="${esc(v.ins)}"></label></div>
    <p class="muted">Tarikh dimasukkan sendiri oleh anda. Sahkan di sumber rasmi sebelum bergantung padanya.</p></div>`}).join('')}
    <details><summary>+ Tambah kenderaan</summary><div class="grid">${input('nvp','No. plat')}${input('nvb','Buatan')}${input('nvm','Model')}${input('nvy','Tahun',{mode:'numeric'})}${input('nvk','Odometer (km)',{mode:'numeric'})}</div><button class="btn" data-act="addVeh">Simpan</button></details></div>
  <div class="card"><h2>Tempahan</h2>${S.bookings.length?S.bookings.slice().reverse().map(b=>{const v=by('vehicles',b.vid);return `<div style="border-bottom:1px solid var(--line);padding:8px 0"><div class="row sp"><b>${SV[b.svc].n}</b><span class="pill ${b.st==='completed'?'ok':b.st==='cancelled'||b.st==='noshow'?'bad':'info'}">${ST[b.st]}</span></div><div class="muted">${esc(v.plate)} · ${esc(by('branches',b.bid).name)} · ${dtfmt(b.s)}</div>${b.st==='confirmed'?`<button class="btn ghost" data-act="cancel" data-id="${b.id}" style="margin-top:6px">Batal</button>`:''}</div>`}).join(''):'<p class="muted">Tiada tempahan lagi.</p>'}</div></div>`;
  h+=`<div class="card"><h2>Pasport Servis Kebangsaan</h2>${S.vehicles.map(v=>{const rs=S.records.filter(r=>r.vid===v.id).sort((a,b)=>b.ts-a.ts);return `<h3>${esc(v.plate)}</h3>${rs.length?`<ol class="tl">${rs.map(r=>`<li><div class="row"><b>${dfmt(r.date)}</b>${r.src==='verified'?'<span class="pill ok">Disahkan CARREPUBLIC</span>':'<span class="pill">Dokumen pelanggan (tidak disahkan)</span>'}<span class="pill warn">DEMO</span></div><div>${esc(r.sum)}</div><div class="muted">${r.bid?esc(by('branches',r.bid).name):'Luar rangkaian'} · ${r.km||'?'} km${r.oil?' · '+esc(r.oil):''}${r.total!=null?' · '+rm(r.total):''}${r.inv?' · '+esc(r.inv):''}</div>${r.items.length?`<ul class="sm">${r.items.map(i=>`<li>${esc(i.d)}: ${rm(i.q*i.p)}</li>`).join('')}</ul>`:''}</li>`).join('')}</ol>`:'<p class="muted">Belum ada rekod.</p>'}`}).join('')}
  <details><summary>+ Tambah rekod servis luar</summary><div class="grid">${sel('ev','Kenderaan',vOpts())}${input('ed','Tarikh',{type:'date'})}${input('ek','Odometer',{mode:'numeric'})}${input('es','Ringkasan')}</div><button class="btn" data-act="addExt">Simpan</button></details></div>`;

  <label style="margin-top:12px"><input type="checkbox" id="share" data-ui="share" data-cb="1" ${f.share?'checked':''}>Kongsi sejarah servis kenderaan ini dengan cawangan ini sepanjang tempahan aktif (boleh ditarik balik).</label>
  <button class="btn alt" data-act="book" ${ui.slot?'':'disabled'}>Sahkan tempahan</button></div>`}

  const pt=(type,title,desc,field)=>{const p=S.partners[type];if(!p.on)return '';return `<div class="partner"><div class="row sp"><h2 style="margin:0">${title}</h2><span class="pill warn">SLOT RAKAN${p.name?'':' · KOSONG'}</span></div>
  <p class="sm">${desc}</p><p class="muted">${p.name?'Rakan: <b>'+esc(p.name)+'</b>':'Belum ada rakan sebenar disambungkan. Ini susun atur contoh untuk ruangan rakan.'} Harga, produk dan kelayakan ditentukan oleh rakan, bukan CARREPUBLIC.</p>

  <p class="sm">Tarikh ${type==='insurance'?'insurans':'cukai jalan'} tamat: ${(()=>{const v=by('vehicles',ui.f['lv:'+type]);const d=v&&(type==='insurance'?v.ins:v.rt);return d?dfmt(d):'(isi di Garaj)'})()}</p>

  <div class="card" style="margin-top:12px"><h3>Permohonan anda</h3>${S.leads.length?S.leads.slice().reverse().map(l=>`<div class="sm">${l.type==='insurance'?'Insurans':'Cukai jalan'} · ${esc(l.plate)} · ${dtfmt(l.ts)} · <span class="pill info">${esc(l.st)}</span></div>`).join(''):'<span class="muted">Belum ada.</span>'}</div>`}

function cPrivasi(){const c=S.consent;const row=(k,t)=>`<label style="color:var(--fg)"><input type="checkbox" id="c:${k}" data-act="consent" data-id="${k}" ${c[k]?'checked':''}>${t}</label>`;
  return `<h1>Privasi &amp; persetujuan</h1><div class="card">${row('reminder','Peringatan servis')}${row('marketing','Mesej promosi / pemasaran')}${row('history','Kongsi sejarah servis dengan cawangan yang saya tempah')}${row('location','Guna lokasi untuk cadangan cawangan')}<h3 style="margin-top:12px">Profil untuk peringatan</h3><div class="grid"><label>Nama<input id="pf:name" data-ui="pf:name" value="${esc(S.profile.name)}"></label><label>No. telefon (untuk WhatsApp)<input id="pf:phone" data-ui="pf:phone" inputmode="tel" placeholder="01X-XXXXXXX" value="${esc(S.profile.phone)}"></label><label>Poskod (untuk cadangan cawangan)<input id="pf:pc" data-ui="pf:pc" inputmode="numeric" value="${esc(S.profile.postcode)}"></label></div><p class="muted">Menarik balik persetujuan menghentikan mesej berkaitan, tetapi sejarah servis anda kekal.</p></div>`}

function viewBranch(){
  const bid=ui.branch,br=by('branches',bid);
  const act=S.bookings.filter(b=>b.bid===bid&&!['completed','cancelled','noshow'].includes(b.st)).sort((a,b)=>a.s-b.s);
  const done=S.records.filter(r=>r.bid===bid&&r.src==='verified').sort((a,b)=>b.ts-a.ts);
  const today=ymd(now());
  const due=S.reminders.filter(r=>r.st!=='completed'&&S.records.find(x=>x.id===r.rec&&x.bid===bid));
  let h=`<div class="row sp"><h1>BranchOS: ${esc(br.name)}</h1><label style="margin:0">Cawangan<select id="bsel" data-act="bsel">${S.branches.map(b=>`<option value="${b.id}" ${b.id===bid?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label></div>
  <p class="muted">${esc(br.note)} Waktu ${br.open}–${br.close} · ${br.bays} bay.</p>
  <div class="kpis"><div class="kpi"><small>Dalam rangkaian kerja</small><b>${act.length}</b></div><div class="kpi"><small>Menunggu kelulusan</small><b>${act.filter(b=>b.st==='awaiting').length}</b></div><div class="kpi"><small>Jualan hari ini</small><b>${rm(done.filter(r=>r.date===today).reduce((a,r)=>a+r.total,0))}</b></div><div class="kpi"><small>Pelanggan akan due</small><b>${due.length}</b></div></div>

  <div class="card"><h2>Servis terkini</h2>${done.length?done.map(r=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line)">${dfmt(r.date)} · ${esc(by('vehicles',r.vid).plate)} · ${esc(r.sum)} · <b>${rm(r.total)}</b> · ${esc(r.inv)}</div>`).join(''):'<span class="muted">Belum ada.</span>'}</div>
  <div class="card"><h2>Pelanggan akan due servis</h2>${due.length?due.map(r=>`<div class="sm">${esc(by('vehicles',r.vid).plate)} · anggaran ${dfmt(r.date)} / ${r.km} km · <span class="pill ${REM[remStatus(r)][1]}">${REM[remStatus(r)][0]}</span></div>`).join(''):'<span class="muted">Tiada.</span>'}</div>
  ${branchJobs(bid)}<div class="hint">Cawangan tidak nampak tempahan cawangan lain, maklumat insurans/roadtax pelanggan, atau kos cawangan lain. Sejarah servis cawangan lain hanya kelihatan semasa tempahan aktif dan dengan persetujuan pelanggan.</div>`;return h}

function bCard(b){const v=by('vehicles',b.vid),id=b.id;let h=`<div class="card" style="margin-bottom:10px"><div class="row sp"><span><b>${esc(v.plate)}</b> ${esc(v.make)} ${esc(v.model)}<div class="muted">${SV[b.svc].n} · ${dtfmt(b.s)}</div></span><span class="pill ${b.st==='awaiting'?'warn':'info'}">${ST[b.st]}</span></div>`;
  const other=S.consent.history&&b.share?S.records.filter(r=>r.vid===b.vid&&r.bid!==b.bid&&r.src==='verified'):[];
  if(other.length)h+=`<div class="hint" style="margin-top:8px"><b>Sejarah dikongsi pelanggan (cawangan lain):</b> ${other.map(r=>dfmt(r.date)+' · '+esc(by('branches',r.bid).name)+' · '+r.km+' km').join('; ')}</div>`;
  if(b.st==='confirmed')h+=`<div class="row" style="margin-top:8px"><button class="btn" data-act="stage" data-id="${id}" data-v="arrived">Pelanggan tiba</button><button class="btn ghost" data-act="stage" data-id="${id}" data-v="noshow">Tidak hadir</button></div>`;
  if(b.st==='arrived'||(b.st==='inspection'&&!(b.insp&&b.insp.done)))h+=`<h3 style="margin-top:10px">Senarai semak pemeriksaan <span class="muted">(isi hanya yang benar-benar diperiksa)</span></h3>${CHECK.map((c,i)=>`<div class="row" style="margin-bottom:6px"><span class="sm" style="width:170px">${c}</span><select id="ir:${id}:${i}" data-ui="ir:${id}:${i}" style="width:auto;margin:0"><option value="tidak">Tidak diperiksa</option><option value="ok" ${ui.f['ir:'+id+':'+i]==='ok'?'selected':''}>OK</option><option value="perhatian" ${ui.f['ir:'+id+':'+i]==='perhatian'?'selected':''}>Perlu perhatian</option></select><input id="in:${id}:${i}" data-ui="in:${id}:${i}" placeholder="Catatan" style="flex:1;margin:0" value="${esc(ui.f['in:'+id+':'+i]||'')}"></div>`).join('')}<div class="row">${input('ikm:'+id,'Odometer masuk (km)',{mode:'numeric'})}<button class="btn" data-act="insp" data-id="${id}">Lengkapkan pemeriksaan</button></div>`;
  if((b.st==='inspection'&&b.insp&&b.insp.done)||b.st==='service')h+=`<h3 style="margin-top:10px">${b.st==='service'?'Kerja tambahan (perlu kelulusan pelanggan)':'Sebut harga berperincian'}</h3>${[0,1,2,3].map(i=>`<div class="row" style="margin-bottom:6px"><input id="qd:${id}:${i}" data-ui="qd:${id}:${i}" placeholder="Keterangan" style="flex:2 1 160px;margin:0" value="${esc(ui.f['qd:'+id+':'+i]||'')}"><input id="qq:${id}:${i}" data-ui="qq:${id}:${i}" placeholder="Qty" inputmode="decimal" style="flex:0 0 70px;margin:0" value="${esc(ui.f['qq:'+id+':'+i]||'')}"><input id="qp:${id}:${i}" data-ui="qp:${id}:${i}" placeholder="RM seunit" inputmode="decimal" style="flex:0 0 110px;margin:0" value="${esc(ui.f['qp:'+id+':'+i]||'')}"></div>`).join('')}<div class="row"><button class="btn" data-act="quote" data-id="${id}">Hantar sebut harga</button>${b.st==='service'?`<button class="btn ghost" data-act="stage" data-id="${id}" data-v="quality">Kerja siap → Semakan kualiti</button>`:''}</div>`;
  if(b.st==='awaiting')h+=`<p class="sm" style="color:var(--warn)">Menunggu pelanggan meluluskan sebut harga. Tiada kerja bermula tanpa kelulusan.</p>`;
  if(b.st==='quality')h+=`<div style="margin-top:8px"><button class="btn" data-act="stage" data-id="${id}" data-v="ready">Lulus semakan kualiti → Sedia diambil</button></div>`;
  if(b.st==='quality'||b.st==='ready')h+=`<h3 style="margin-top:10px">Selesai &amp; invois</h3><div class="grid">${input('ok:'+id,'Odometer keluar (km)',{mode:'numeric'})}${input('oo:'+id,'Spesifikasi minyak enjin')}${input('os:'+id,'Ringkasan kerja')}${input('oc:'+id,'Kos dalaman RM (margin, tidak dipapar kepada pelanggan)',{mode:'decimal'})}</div><button class="btn alt" data-act="complete" data-id="${id}">Selesai &amp; jana invois</button>`;
  return h+'</div>'}

const TAv=(k,label,val,rows)=>`<label>${label}<textarea id="${esc(k)}" data-ui="${esc(k)}" rows="${rows||3}">${esc(ui.f[k]!=null?ui.f[k]:val)}</textarea></label>`;
const TA=(k,label,rows,ph)=>`<label>${label}<textarea id="${esc(k)}" data-ui="${esc(k)}" rows="${rows||3}" placeholder="${esc(ph||'')}">${esc(ui.f[k]||'')}</textarea></label>`;
function waPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='6'+d;return /^601\d{8,9}$/.test(d)?d:''}
function nearBranch(){const pc=(S.profile.postcode||'').slice(0,2);const m=S.branches.filter(b=>b.postcode.slice(0,2)===pc);return (m.length?m:S.branches).map(b=>b.name).slice(0,2).join(' / ')}
function waMsg(r){const v=by('vehicles',r.vid),st=remStatus(r);const t=st==='overdue'?S.wa.tpl.overdue:S.wa.tpl.reminder;
  return t.replace(/\{nama\}/g,S.profile.name||'pelanggan').replace(/\{plat\}/g,v.plate).replace(/\{tarikh\}/g,dfmt(r.date)).replace(/\{km\}/g,r.km).replace(/\{cawangan\}/g,nearBranch()).replace(/\{pautan\}/g,location.href.split('#')[0])+STOPLINE}
function waQueue(){return S.reminders.filter(r=>r.st!=='completed').map(r=>{const st=remStatus(r),why=[];
  if(!S.consent.reminder)why.push('Pelanggan tiada persetujuan peringatan');
  if(st==='booked')why.push('Sudah ditempah (peringatan ditindas)');
  if(!waPhone(S.profile.phone))why.push('Nombor telefon pelanggan tiada atau tidak sah');
  const days=Math.round((new Date(r.date+'T00:00:00')-new Date(ymd(now())+'T00:00:00'))/DAY);
  if(st==='upcoming'&&days>S.wa.before)why.push('Belum masuk tempoh ('+S.wa.before+' hari sebelum anggaran)');
  const kind=st==='overdue'?'overdue':'reminder';
  if(S.wa.log.some(l=>l.rid===r.id&&l.kind===kind&&l.ok))why.push('Mesej jenis ini sudah dihantar');
  return {r,st,why,kind}})}
function waSend(rid){const x=waQueue().find(q=>q.r.id===rid);if(!x)return;if(x.why.length)return setMsg('err','Tidak boleh dihantar: '+x.why[0]);
  S.wa.log.push({id:nid('w'),rid,ts:Date.now(),plat:by('vehicles',x.r.vid).plate,kind:x.kind,text:waMsg(x.r),status:'Dihantar (simulasi)',ok:true});setMsg('ok','Mesej direkod sebagai dihantar (simulasi). Tiada mesej sebenar dihantar.');save()}
function waStop(){S.consent.reminder=false;S.wa.log.push({id:nid('w'),rid:null,ts:Date.now(),plat:'-',kind:'berhenti',text:'Pelanggan membalas BERHENTI',status:'Peringatan dimatikan',ok:false});setMsg('ok','Pelanggan membalas BERHENTI. Persetujuan peringatan dimatikan; sejarah servis kekal.');save()}
function waSave(){const a=(ui.f['wt:reminder']!=null?ui.f['wt:reminder']:S.wa.tpl.reminder).trim(),b=(ui.f['wt:overdue']!=null?ui.f['wt:overdue']:S.wa.tpl.overdue).trim();
  if(!a||!b||a.length>600||b.length>600)return setMsg('err','Templat tidak boleh kosong dan maksimum 600 aksara.');
  S.wa.tpl={reminder:a,overdue:b};ui.f['wt:reminder']=ui.f['wt:overdue']=null;setMsg('ok','Templat disimpan. Arahan BERHENTI ditambah secara automatik.');save()}
function hqWa(){ui.f.wb=String(S.wa.before);const q=waQueue(),ok=q.filter(x=>!x.why.length);
  return `<h1>WhatsApp peringatan</h1><p class="muted">Hanya untuk pelanggan yang memberi persetujuan, ditindas selepas tempahan, dan sentiasa ada arahan BERHENTI. <b>Mod demo:</b> tiada mesej dihantar automatik. Penghantaran automatik memerlukan WhatsApp Business Platform rasmi dan templat yang diluluskan Meta. "Buka WhatsApp" membolehkan staf menghantar secara manual.</p>
  <div class="kpis"><div class="kpi"><small>Layak dihantar sekarang</small><b>${ok.length}</b></div><div class="kpi"><small>Ditindas atau belum masa</small><b>${q.length-ok.length}</b></div><div class="kpi"><small>Mesej dalam log</small><b>${S.wa.log.length}</b></div></div>
  <div class="card"><h2>Baris gilir peringatan</h2>${q.length?q.map(x=>{const v=by('vehicles',x.r.vid),txt=waMsg(x.r),R=REM[x.st];return `<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row sp"><b>${esc(v.plate)} · ${esc(S.profile.name)}</b><span class="pill ${R?R[1]:''}">${R?R[0]:x.st}</span></div>${x.why.length?`<div class="sm" style="color:var(--warn)">Tidak dihantar: ${x.why.map(esc).join('; ')}</div>`:`<div class="sm" style="background:var(--chip);border-radius:10px;padding:8px;white-space:pre-wrap;margin-top:6px">${esc(txt)}</div><div class="row" style="margin-top:8px"><button class="btn" data-act="waSend" data-id="${x.r.id}">Hantar (simulasi)</button><a class="btn alt" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/${waPhone(S.profile.phone)}?text=${encodeURIComponent(txt)}">Buka WhatsApp</a></div>`}</div>`}).join(''):'<p class="muted">Tiada peringatan. Siapkan satu servis, kemudian guna "Simulasi +6 bulan".</p>'}
  <button class="btn ghost" data-act="waStop" style="margin-top:10px">Simulasi: pelanggan balas BERHENTI</button></div>

  <p class="muted">Pemboleh ubah: {nama} {plat} {tarikh} {km} {cawangan} {pautan}. Nada mesti sopan dan tidak mendesak; peringatan ialah jadual, bukan diagnosis.</p>${TAv('wt:reminder','Templat peringatan',S.wa.tpl.reminder,4)}${TAv('wt:overdue','Templat tertunggak',S.wa.tpl.overdue,4)}<button class="btn" data-act="waSave">Simpan templat</button></div>

  const title=(f['j:title']||'').trim();if(!title)return setMsg('err','Isi tajuk jawatan.');

function scoreOf(job,a){const must=job.must,met=must.filter((_,i)=>a.must[i]).length,mr=must.length?met/must.length:1,er=job.exp>0?Math.min(a.exp/job.exp,1):1;return {total:Math.round(100*(0.7*mr+0.3*er)),met,tot:must.length,er,licFlag:job.lic&&!a.lic}}

  <div class="card"><h2>Calon (disusun ikut skor padanan)</h2><p class="muted">Skor = 70% syarat wajib yang calon tanda + 30% pengalaman berbanding minimum. Ia alat bantu saringan berdasarkan pengakuan calon, bukan keputusan. Semak setiap calon secara manusia.</p>
  ${S.apps.length?S.apps.map(a=>({a,j:by('jobs',a.jid)})).filter(x=>x.j).map(x=>({...x,s:scoreOf(x.j,x.a)})).sort((p,q)=>q.s.total-p.s.total).map(({a,j,s})=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row sp"><span><b>${esc(a.name)}</b> · ${esc(j.title)}</span><span class="pill ${s.total>=70?'ok':s.total>=40?'warn':'bad'}">Skor ${s.total}/100</span></div>
  <div class="sm">Syarat wajib ${s.met}/${s.tot} · pengalaman ${a.exp} tahun (min ${j.exp})${s.licFlag?' · <span class="pill bad">Tiada lesen (wajib)</span>':''}</div>
  <div class="sm">Tel: <a href="https://wa.me/${waPhone(a.phone)}" target="_blank" rel="noopener">${esc(a.phone)}</a>${a.email?' · '+esc(a.email):''}</div>
  <details><summary>Jawapan saringan</summary>${j.qs.map((q,i)=>`<div class="sm"><b>${esc(q)}</b><br>${esc(a.ans[i]||'(tiada jawapan)')}</div>`).join('')}</details>
  <label>Peringkat<select data-act="stg" data-id="${a.id}">${STAGES.map(t=>`<option ${a.st===t?'selected':''}>${t}</option>`).join('')}</select></label></div>`).join(''):'<p class="muted">Belum ada calon. Tukar ke paparan Kerjaya (calon) dan hantar satu permohonan untuk mencuba.</p>'}</div>`}
function branchJobs(bid){const js=S.jobs.filter(j=>j.bid===bid&&j.st==='terbuka');return `<div class="card"><h2>Kekosongan staf cawangan ini</h2>${js.length?js.map(j=>`<div class="sm">${esc(j.title)} · ${j.count} kekosongan · ${S.apps.filter(a=>a.jid===j.id).length} calon</div>`).join(''):'<span class="muted">Tiada. HQ membuka jawatan di tab Rekrutmen.</span>'}</div>`}
function viewHQ(){const t=ui.ht||'ringkas';
  return `<div class="tabs">${[['ringkas','Ringkasan'],['wa','WhatsApp peringatan'],['rekrut','Rekrutmen staf']].map(([k,n])=>`<button class="tab sub" aria-pressed="${t===k}" data-act="ht" data-v="${k}">${n}</button>`).join('')}</div>`+(t==='wa'?hqWa():t==='rekrut'?hqRec():hqSummary())}

function render(){
  const y=window.scrollY,fid=document.activeElement&&document.activeElement.id,fs=document.activeElement&&document.activeElement.selectionStart;
  const app=document.getElementById('app');
  app.innerHTML=!ui.logged?viewLogin():head()+(ui.role==='cust'?viewCust():ui.role==='branch'?viewBranch():ui.role==='kerja'?viewKerja():viewHQ());
  window.scrollTo(0,y);
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(fs!=null)el.setSelectionRange(fs,fs)}catch(e){}}}
}
/* ---------- events ---------- */
const A={
 role:e=>{ui.role=e.v;ui.msg=null},ct:e=>{ui.ct=e.v;ui.msg=null},
 skip:()=>{S.skip+=182;setMsg('ok','Masa disimulasi maju 6 bulan (demo). Peringatan dikira semula.');save()},
 reset:()=>{S=seed();ext();ui.f={};ui.slot=null;ui.msg=null;store.set(JSON.stringify(S));setMsg('ok','Demo disetkan semula.')},
 logout:()=>{ui.logged=false;ui.msg=null},
 approve:e=>decide(e.id,true),reject:e=>decide(e.id,false),
 remBook:e=>{ui.f.vid=e.id;ui.f.src='reminder';ui.ct='tempah';ui.msg=null},
 updKm:e=>updKm(e.id),addVeh:addVehicle,addExt,cancel:e=>cancel(e.id),
 slot:e=>{ui.slot=+e.v},book,
 stage:e=>stage(e.id,e.v),insp:e=>saveInsp(e.id),quote:e=>sendQuote(e.id),complete:e=>complete(e.id),
 lead:e=>submitLead(e.id),ht:e=>{ui.ht=e.v;ui.msg=null},waSend:e=>waSend(e.id),waStop,waSave,jobFill,jobDraft:()=>jobSave('draf'),jobPub:()=>jobSave('terbuka'),jobSt:e=>{by('jobs',e.id).st=e.v;save()},jobDel:e=>{S.jobs=S.jobs.filter(j=>j.id!==e.id);S.apps=S.apps.filter(a=>a.jid!==e.id);save()},apply:e=>applyJob(e.id),applyOpen:e=>{ui.apply=e.id},applyClose:()=>{ui.apply=null},
 pname:e=>{S.partners[e.id].name=(ui.f['pn:'+e.id]||'').trim();setMsg('ok','Nama rakan disimpan.');save()}
};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||t.type==='checkbox')return;const f=A[t.dataset.act];if(!f)return;f({id:t.dataset.id,v:t.dataset.v});render()});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.act==='consent'){S.consent[t.dataset.id]=t.checked;setMsg('ok','Pilihan disimpan.');save();render();return}
  if(t.dataset.act==='pon'){S.partners[t.dataset.id].on=t.checked;save();render();return}
  if(t.dataset.act==='lst'){by('leads',t.dataset.id).st=t.value;save();render();return}
  if(t.dataset.act==='bsel'){ui.branch=t.value;render();return}
  if(t.dataset.act==='stg'){by('apps',t.dataset.id).st=t.value;save();render();return}
  if(t.dataset.ui){const k=t.dataset.ui;ui.f[k]=t.dataset.cb?t.checked:t.value;
    if(k.startsWith('rt:')){by('vehicles',k.slice(3)).rt=t.value;save()}
    if(k==='pf:name'){S.profile.name=t.value;save()}if(k==='pf:phone'){S.profile.phone=t.value;save()}if(k==='pf:pc'){S.profile.postcode=t.value;save()}
    if(k==='wb'){S.wa.before=+t.value;save()}
    if(k.startsWith('in:')&&k.split(':').length===2){by('vehicles',k.slice(3)).ins=t.value;save()}
    if(['vid','bid','svc','date'].includes(k)){ui.slot=null}
    if((t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&!t.dataset.cb&&t.type!=='date')return;
    render()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.ui&&!t.dataset.cb&&t.type!=='date')ui.f[t.dataset.ui]=t.value});
document.addEventListener('submit',ev=>{if(ev.target.id==='lf'){ev.preventDefault();const e=(ui.f.le||'').trim().toLowerCase(),p=ui.f.lp||'';
  if(e==='master@carrepublic.demo'&&p==='Demo#2026'){ui.logged=true;ui.msg=null;ui.f.lp=''}else setMsg('err','E-mel atau kata laluan salah. Guna akaun master demo di bawah.');render()}});
window.__careos={S:()=>S,ui,A,render};
render();
})();
</script>

</body></html>
